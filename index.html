  S.reviewId = id;
  ED = JSON.parse(JSON.stringify(p.extracted));
  S.zoom = 1;
  S.view = "review";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function refreshChecksLive() {
  if (!ED) return;
  const e = ED;
  const totalsMismatch = Math.abs(e.subtotal + e.tax_amount - e.total) > 0.02;
  const itemsTotal = round2(e.items.reduce((a, it) => a + it.qty * it.unit_price, 0));
  const expectedTax = round2((e.subtotal * e.tax_rate) / 100);
  const taxMismatch = Math.abs(expectedTax - e.tax_amount) > 0.05;
  const chips = $("#totals-chips");
  if (chips) {
    chips.innerHTML = '<span class="fchip ' + (totalsMismatch ? "fchip-no" : "fchip-ok") + '">' + (totalsMismatch ? IC.x : IC.check) + " base + IVA = " + eur(round2(e.subtotal + e.tax_amount)) + "</span>" +
      (taxMismatch ? '<span class="fchip fchip-warn">' + IC.alert + " cuota esperada " + eur(expectedTax) + "</span>" : "") +
      '<button class="btn btn-warn btn-sm" style="margin-left:auto;display:' + (totalsMismatch || taxMismatch || Math.abs(itemsTotal - e.subtotal) > 0.02 ? "" : "none") + '" data-act="recalc">' + IC.zap + " Recalcular desde partidas</button>";
  }
  const checks = [
    [!!e.supplier_name.trim() && !!e.invoice_number.trim(), "Proveedor y número identificados"],
    [!!e.invoice_date && (!e.due_date || e.due_date >= e.invoice_date), "Fechas coherentes"],
    [!totalsMismatch && e.total > 0, "Totales cuadran con el documento"],
  ];
  const box = $("#checks-box");
  if (box) {
    const low = S.reviewId ? (pendingById(S.reviewId) || { confidence: {} }).confidence : {};
    const lowN = Object.values(low).filter(v => v < 0.75).length;
    checks.push([lowN === 0, "Confianza OCR suficiente en todos los campos"]);
    box.innerHTML = checks.map(c => '<span class="check ' + (c[0] ? "ok" : "no") + '">' + (c[0] ? IC.check : IC.x) + " " + c[1] + "</span>").join("");
  }
  const btn = $("#approve-btn");
  if (btn) {
    const bad = !e.supplier_name.trim() || !e.invoice_number.trim() || !e.invoice_date ||
      (e.due_date && e.invoice_date && e.due_date < e.invoice_date) || e.total <= 0 || totalsMismatch;
    btn.disabled = !!bad;
  }
  document.querySelectorAll("input[data-fi]").forEach(inp2 => {
    const i = parseInt(inp2.dataset.fi, 10);
    const td = inp2.closest("td");
    if (td && td.nextElementSibling && td.nextElementSibling.nextElementSibling && inp2.dataset.fk !== "description") {
      /* importe por fila */
    }
  });
  /* importes por fila */
  document.querySelectorAll("tr[data-rowtotal]").forEach(() => {});
  const rowsT = document.querySelectorAll(".tbl tbody tr");
  rowsT.forEach(tr => {
    const cells = tr.querySelectorAll("td");
    if (cells.length === 4) {
      const it = ED.items[Array.prototype.indexOf.call(tr.parentNode.children, tr)];
      if (it) cells[3].textContent = eur(it.qty * it.unit_price);
    }
  });
}
function doApprove() {
  const rec = pendingById(S.reviewId);
  if (!rec || !ED) return;
  if (!S.online) {
    rec.__valid = ED;
    DB.outbox.push({ id: uid(), kind: "approve", payload: { id: rec.id }, created_at: new Date().toISOString() });
    persist(); render();
    toast("warn", "Sin conexión: la aprobación se encoló y se aplicará al reconectar.");
    return;
  }
  try {
    apiApprove(rec.id, ED, S.user);
    S.modal = { type: "stamped", id: rec.id };
    render();
    setTimeout(() => {
      S.modal = null; S.reviewId = null;
      render();
      toast("ok", "Factura registrada en la DB definitiva");
    }, 1400);
  } catch (e) { toast("err", e.message); }
}
function doReject() {
  const rec = pendingById(S.reviewId);
  const reason = S.rejectReason.trim();
  if (!rec || reason.length < 8) return;
  if (!S.online) {
    DB.outbox.push({ id: uid(), kind: "reject", payload: { id: rec.id, reason: reason }, created_at: new Date().toISOString() });
    persist();
    S.modal = null; S.rejectReason = ""; S.reviewId = null;
    render();
    toast("warn", "Sin conexión: el rechazo se encoló y se aplicará al reconectar.");
    return;
  }
  try {
    apiReject(rec.id, reason, S.user);
    S.modal = null; S.rejectReason = ""; S.reviewId = null;
    render();
    toast("ok", "Factura rechazada · registrada en auditoría");
  } catch (e) { toast("err", e.message); }
}

document.addEventListener("click", e => {
  const bg = e.target.closest('[data-act="modal-bg"]');
  if (bg && e.target === bg) { stopCamera(); S.modal = null; render(); return; }
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;

  if (act === "nav") { S.view = t.dataset.view; if (t.dataset.view !== "review") S.reviewId = null; render(); window.scrollTo({ top: 0 }); return; }
  if (act === "logout") { stopCamera(); try { localStorage.removeItem("ff_session_v1"); } catch (x) {} S.user = null; S.modal = null; S.reviewId = null; S.view = "dashboard"; render(); return; }
  if (act === "modal-close") { stopCamera(); S.modal = null; render(); return; }
  if (act === "toast-x") { S.toasts = S.toasts.filter(x => x.id !== t.dataset.id); render(); return; }
  if (act === "demo-login") { doLogin(t.dataset.e, t.dataset.p, t); return; }
  if (act === "pass-show") {
    const inp2 = document.getElementById(t.dataset.for);
    if (inp2) {
      const show = inp2.type === "password";
      inp2.type = show ? "text" : "password";
      t.innerHTML = show ? IC.eyeoff : IC.eye;
    }
    return;
  }
  if (act === "pass-open") { S.modal = { type: "chpass" }; render(); return; }

  /* scanner */
  if (act === "pick-file") { const fi = $("#file-in"); if (fi) fi.click(); return; }
  if (act === "cam-open") { S.modal = { type: "cam" }; render(); return; }
  if (act === "cam-capture") {
    const v = $("#cam-video");
    if (!v || !v.videoWidth) { showCamErr("La cámara aún no está lista."); return; }
    const c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    const url = c.toDataURL("image/jpeg", 0.85);
    stopCamera(); S.modal = null;
    void handleFile({ name: "captura.jpg", type: "image/jpeg", size: Math.round(url.length * 0.75) }, url);
    return;
  }
  if (act === "scan-demo") {
    const idx = parseInt(t.dataset.idx, 10);
    const s = synthInvoice(idx + 40 + ((S.user.id.length || 3) % 5));
    S.prio = "medium"; S.notes = "";
    /* genera el documento con esa semilla y lo trata como archivo */
    void (async () => {
      S.scanStep = "processing"; S.scanStage = 0; S.scanRes = null;
      S.scanFile = s.extracted.invoice_number.toLowerCase().replace(/[^a-z0-9]+/g, "_") + ".jpg";
      render();
      for (let i = 0; i < OCR_STAGES.length; i++) { S.scanStage = i; render(); await wait(300 + Math.random() * 260); }
      S.scanRes = { extracted: s.extracted, confidence: confidences(hashStr(s.extracted.invoice_number)), docUrl: s.docUrl, lines: 22, source: "synthetic" };
      S.scanStep = "result"; render();
    })();
    return;
  }
  if (act === "scan-discard") { S.scanStep = "pick"; S.scanRes = null; S.notes = ""; render(); return; }
  if (act === "scan-send") { sendScan(); return; }

  /* review */
  if (act === "open-review") { openReview(t.dataset.id); return; }
  if (act === "back-queue") { S.reviewId = null; render(); return; }
  if (act === "zoom") { S.zoom = Math.min(1.75, Math.max(0.75, round2(S.zoom + (t.dataset.dir === "1" ? 0.25 : -0.25)))); render(); return; }
  if (act === "recalc") {
    if (!ED) return;
    const subtotal = round2(ED.items.reduce((a, it) => a + it.qty * it.unit_price, 0));
    ED.subtotal = subtotal;
    ED.tax_amount = round2((subtotal * ED.tax_rate) / 100);
    ED.total = round2(subtotal + ED.tax_amount);
    render();
    toast("ok", "Totales recalculados desde las partidas");
    return;
  }
  if (act === "approve") { doApprove(); return; }
  if (act === "reject-open") { S.rejectReason = ""; S.modal = { type: "reject" }; render(); const rr = $("#rej-reason"); if (rr) rr.focus(); return; }
  if (act === "reject-confirm") { doReject(); return; }
  if (act === "qfilter") { S.fQ = t.dataset.f; render(); return; }

  /* invoices */
  if (act === "view-approved") { S.modal = { type: "view", id: t.dataset.id }; render(); return; }
  if (act === "del-open") { S.modal = { type: "del", id: t.dataset.id }; render(); return; }
  if (act === "del-confirm") {
    try { apiDeleteApproved(t.dataset.id, S.user); S.modal = null; render(); toast("ok", "Registro eliminado · anotado en auditoría"); }
    catch (err) { toast("err", err.message); }
    return;
  }
  if (act === "export-csv") {
    let list = DB.approved.slice();
    if (S.cat !== "all") list = list.filter(a => a.category === S.cat);
    if (S.qInv.trim()) { const q = S.qInv.trim().toLowerCase(); list = list.filter(a => a.supplier_name.toLowerCase().includes(q) || a.invoice_number.toLowerCase().includes(q)); }
    if (!list.length) { toast("warn", "No hay facturas aprobadas que exportar"); return; }
    downloadCSV("facturaflow_definitivas.csv",
      ["Nº factura", "Proveedor", "NIF", "Fecha", "Vencimiento", "Base", "IVA", "Total", "Divisa", "Categoría", "Revisada por"],
      list.map(r => { const rv = userById(r.reviewed_by); return [r.invoice_number, r.supplier_name, r.supplier_tax_id, r.invoice_date, r.due_date, r.subtotal.toFixed(2), r.tax_amount.toFixed(2), r.amount.toFixed(2), r.currency, r.category, rv ? rv.full_name : "-"]; }));
    audit(S.user, "data.export", "invoices_approved", "-", "Exportación CSV · " + list.length + " registros");
    save();
    toast("ok", "CSV exportado · " + list.length + " registros");
    return;
  }

  /* users */
  if (act === "user-toggle") {
    const u = userById(t.dataset.id);
    if (!u) return;
    try { apiSetUserActive(u.id, !u.is_active, S.user); toast("ok", u.full_name + (!u.is_active ? " activado" : " desactivado")); }
    catch (err) { toast("err", err.message); }
    return;
  }
  if (act === "reset-open") { S.resetPass = ""; S.modal = { type: "reset", id: t.dataset.id }; render(); return; }
  if (act === "reset-confirm") {
    try { apiResetPassword(t.dataset.id, S.resetPass, S.user); S.modal = null; render(); toast("ok", "Contraseña restablecida"); }
    catch (err) { const el = $("#reset-btn"); if (el) el.disabled = true; toast("err", err.message); }
    return;
  }
  if (act === "copy-email") {
    const em = t.dataset.email;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(em).then(() => toast("ok", "Correo copiado: " + em)).catch(() => toast("warn", em));
    } else toast("warn", em);
    return;
  }
});

  if (S.online && DB.outbox.length) void processOutbox();
})();
