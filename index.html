<head>

<style>
:root{--bg:#F6F8F4;--card:#fff;--ink:#17261D;--mute:#5E6E63;--line:#DCE4DB;--leaf:#2F7D4A;--leaf-ink:#fff;--kcal:#E4572E;--prot:#3B6FD1;--carb:#E0A81B;--fat:#D9485B;--r:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A13;--card:#17261D;--ink:#EEF4EC;--mute:#9DB0A2;--line:#2A3D31;--leaf:#5BBF7C;--leaf-ink:#0F1A13}}
:root[data-theme="dark"]{--bg:#0F1A13;--card:#17261D;--ink:#EEF4EC;--mute:#9DB0A2;--line:#2A3D31;--leaf:#5BBF7C;--leaf-ink:#0F1A13}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
main{max-width:480px;margin:0 auto;padding:20px 20px 40px;min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;height:40px;margin-bottom:24px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.back{border:0;background:none;color:var(--mute);font:inherit;font-size:15px;padding:8px 0;cursor:pointer}
h1{font-size:34px;line-height:1.1;font-weight:800}
h2{font-size:26px;line-height:1.15;font-weight:800;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;cursor:pointer;font-weight:500}
.opt small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--leaf);box-shadow:0 0 0 1px var(--leaf)}
.vivid{margin:16px 0 0;padding:14px 16px;border-left:4px solid var(--leaf);background:var(--card);border-radius:0 12px 12px 0;font-weight:500}
.row{display:grid;gap:12px}
label.f{display:block;font-weight:600;font-size:14px}
label.f input{display:block;width:100%;margin-top:6px;font:inherit;font-size:20px;font-weight:600;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
label.f textarea{display:block;width:100%;min-height:112px;margin-top:6px;font:inherit;font-size:17px;font-weight:500;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;resize:vertical}
.rc .mc{color:var(--mute);font-size:14px;margin:2px 0 0}.rc ul,.rc ol{margin:6px 0 0;padding-left:20px}.rc li{margin:4px 0}.rc summary{cursor:pointer;font-weight:600;color:var(--leaf);margin-top:12px}.rc .addb{margin:14px 0 0}
.err{color:var(--fat);min-height:22px;margin:10px 0 0;font-size:14px}
.cta{margin-top:auto;padding-top:24px}
.cta button{width:100%;border:0;border-radius:14px;background:var(--leaf);color:var(--leaf-ink);font:inherit;font-weight:600;font-size:17px;padding:16px;cursor:pointer}
.cta button:disabled{opacity:.4;cursor:not-allowed}
.cta .ghost{background:none;color:var(--mute);margin-top:6px;font-weight:500;font-size:15px}
.hero{margin:auto 0}
.hero p{color:var(--mute);font-size:18px;margin:14px 0 0}
.plate{width:120px;height:120px;border-radius:50%;border:10px solid var(--line);margin-bottom:28px;background:conic-gradient(var(--prot) 0 25%,var(--carb) 0 60%,var(--fat) 0 100%)}
.kc{text-align:center;padding:4px 0 18px}
.kc .big{font-size:72px;font-weight:800;color:var(--kcal);line-height:1}
.kc span{color:var(--mute);font-weight:600}
.m{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.m .h{display:flex;justify-content:space-between;font-weight:600}
.m .t{height:8px;border-radius:4px;background:var(--line);margin-top:10px;overflow:hidden}
.m .t i{display:block;height:100%}
.note{color:var(--mute);font-size:13px;margin:12px 0 0}
.ok{background:var(--card);border:1.5px dashed var(--leaf);border-radius:var(--r);padding:14px;margin-top:10px;font-size:15px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.vs div{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;font-size:14px}
.vs b{display:block;margin-bottom:4px}
.load{margin:auto 0}
.load li{list-style:none;display:flex;gap:10px;margin:14px 0;opacity:0;animation:in .4s forwards;font-weight:500}
.load li::before{content:"✓";color:var(--leaf);font-weight:800}
.load li:nth-child(2){animation-delay:.9s}.load li:nth-child(3){animation-delay:1.8s}
@keyframes in{to{opacity:1}}
.proj{text-align:center}
.proj .big{font-size:44px;font-weight:800;color:var(--leaf);line-height:1.05;margin:6px 0}
svg.ch{width:100%;height:auto;margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.load li{animation:none;opacity:1}}

.scan{display:block;width:100%;text-align:center;border-radius:14px;background:var(--leaf);color:var(--leaf-ink);font-weight:600;font-size:17px;padding:16px;cursor:pointer}
.ghostl{display:block;text-align:center;color:var(--mute);padding:12px;cursor:pointer;font-size:15px}
.pv{width:100%;max-height:260px;object-fit:cover;border-radius:var(--r);display:block}
.it{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.it small{display:block;color:var(--mute)}.it.off{opacity:.45}.it span{white-space:nowrap;font-weight:600;font-size:14px}.stp{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:none;color:var(--ink);font-size:20px;cursor:pointer}
.addb{display:block;width:100%;margin:2px 0 6px;padding:12px;border:1.5px dashed var(--leaf);border-radius:12px;background:none;color:var(--leaf);font:inherit;font-weight:600;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.dayh{display:flex;justify-content:space-between;color:var(--mute);font-weight:600;font-size:14px;margin:18px 0 8px}.dayh span:first-child{text-transform:capitalize}
.eh{font-size:16px;margin:18px 0 8px;font-family:inherit}
button.it{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg);padding:6px 0 12px;margin-bottom:10px}
.nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:20px;padding:8px 13px;cursor:pointer}
.nav button[aria-current="page"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.nav .ins{margin-left:auto;border-style:dashed;color:var(--leaf);padding:8px 10px}
.wel{display:flex;flex-direction:column;gap:22px;margin:auto 0}
.kick{margin:0;color:var(--leaf);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.wel h1{font-size:40px;line-height:1.02}.wel h1 em{font-style:normal;color:var(--kcal)}
.wel .lead{margin:10px 0 0;color:var(--mute);font-size:17px}
.demo{position:relative;width:250px;height:250px;margin:6px auto 0}
.demo .pl{position:absolute;inset:0;filter:drop-shadow(0 14px 18px rgba(23,38,29,.18))}
.scanl{position:absolute;left:6%;right:6%;height:3px;border-radius:2px;background:var(--leaf);box-shadow:0 0 16px 3px var(--leaf);animation:sweep 3.4s ease-in-out infinite}
@keyframes sweep{0%,100%{top:14%}50%{top:86%}}
.tag{position:absolute;background:var(--card);border:1.5px solid var(--leaf);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;animation:pop .5s forwards;box-shadow:0 6px 14px rgba(23,38,29,.12)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
.ej{text-align:center;color:var(--mute);font-size:12px;margin:-6px 0 0}
.dishes{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.dishes::-webkit-scrollbar{display:none}
.dishes figure{flex:none;margin:0;text-align:center;scroll-snap-align:start;font-size:13px;font-weight:600;width:84px}
.dishes svg,.dishes img{display:block;margin:0 auto 6px;filter:drop-shadow(0 6px 8px rgba(23,38,29,.15))}.dishes img{width:84px;height:84px;object-fit:contain}.demo .pl img{display:block;width:100%;height:100%;object-fit:contain}
.stp3{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.stp3 li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stp3 b{display:block}.stp3 small{color:var(--mute)}.stp3 span{font-size:24px;line-height:1.1}
@media (prefers-reduced-motion:reduce){.scanl{animation:none;top:50%}.tag{animation:none;opacity:1}}
.camov{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.camov video{max-width:100%;max-height:calc(100% - 90px);border-radius:14px;background:#111}
.camov .row2{display:flex;gap:12px;width:min(420px,100%)}
.camov button{flex:1;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--leaf);color:var(--leaf-ink)}
.camov button.x{background:#2a2a2a;color:#fff}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:4px 6px}
.lg h3{font-size:16px;margin:20px 0 4px;font-family:inherit}.lg p,.lg li{margin:6px 0;line-height:1.5;font-size:15px}.lg ul{margin:6px 0;padding-left:20px}
.danger{border-top:1.5px solid var(--line);margin-top:28px;padding-top:6px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
const APP_NAME="ComeBien AI"; // nombre provisorio: se cambia aquí
const KEY="comebien:profile",TOTAL=12;
const PL=(i,z=96)=>`<svg viewBox="0 0 96 96" width="${z}" height="${z}" aria-hidden="true"><circle cx="48" cy="48" r="46" fill="#fff" stroke="#DCE4DB" stroke-width="2"/><circle cx="48" cy="48" r="37" fill="none" stroke="#EEF2EC" stroke-width="2"/>${i}</svg>`;
const MIL='<rect x="16" y="30" width="46" height="34" rx="16" fill="#C98A3E"/><rect x="22" y="36" width="34" height="22" rx="11" fill="#DDA45B"/><g stroke="#F0C94A" stroke-width="5" stroke-linecap="round"><path d="M62 60l14-10M66 68l14-9M58 70l12-4"/></g><circle cx="30" cy="30" r="6" fill="#F4E04D"/><circle cx="66" cy="28" r="9" fill="#6DB766"/><circle cx="62" cy="26" r="3" fill="#D9485B"/>';
const DISHES=[["Milanesa",'<rect x="18" y="30" width="46" height="34" rx="16" fill="#C98A3E"/><rect x="24" y="36" width="34" height="22" rx="11" fill="#DDA45B"/><g stroke="#F0C94A" stroke-width="5" stroke-linecap="round"><path d="M62 60l14-10M66 68l14-9"/></g><circle cx="30" cy="32" r="6" fill="#F4E04D"/>'],["Arepa",'<circle cx="48" cy="48" r="26" fill="#E8C382"/><circle cx="48" cy="48" r="20" fill="#F1D79F"/><path d="M30 46q18-10 36 0v6q-18 8-36 0z" fill="#F6E27A"/>'],["Tacos",'<path d="M12 62a22 22 0 0144 0z" fill="#EBC25A"/><path d="M40 62a22 22 0 0144 0z" fill="#E3B24A"/><path d="M18 58q16-14 32 0M46 58q16-14 32 0" stroke="#5FA55A" stroke-width="5" fill="none"/><circle cx="30" cy="50" r="3" fill="#D9485B"/><circle cx="62" cy="50" r="3" fill="#D9485B"/>'],["Ceviche",'<circle cx="48" cy="48" r="26" fill="#F7EBD9"/><circle cx="38" cy="42" r="7" fill="#F5B7A5"/><circle cx="52" cy="40" r="7" fill="#F8C9B8"/><circle cx="44" cy="54" r="7" fill="#F5B7A5"/><circle cx="58" cy="54" r="6" fill="#F2A25C"/><circle cx="34" cy="56" r="4" fill="#7CBF6B"/><circle cx="60" cy="42" r="3" fill="#8A4FA5"/>'],["Empanadas",'<path d="M14 58a20 20 0 0140 0z" fill="#D9A04E"/><path d="M42 68a20 20 0 0140 0z" fill="#E0AB5A"/><path d="M18 56h32M46 66h32" stroke="#B9822F" stroke-width="3" stroke-dasharray="3 3"/>'],["Ensalada",'<circle cx="40" cy="42" r="13" fill="#6DB766"/><circle cx="56" cy="46" r="13" fill="#85C97A"/><circle cx="46" cy="58" r="12" fill="#5FA55A"/><circle cx="36" cy="54" r="5" fill="#D9485B"/><circle cx="60" cy="36" r="4" fill="#F4C542"/>']];
const CDN=(id,w)=>`https://res.cloudinary.com/dn8yg1w3e/image/upload/f_auto,q_auto,w_${w}/${id}`; // imágenes de la bienvenida (Cloudinary)
const IMG={Milanesa:"v1791936629/mila_m04mci.png",Arepa:"v1791936642/arepas_mtilg5.png",Tacos:"v1791936652/tacos_jhsnvn.png",Ceviche:"v1791936662/ceviche_g5hl3y.png",Empanadas:"v1791936667/empanadas_si8bkn.png"};
const DEMO_IMG="v1791936674/milapapasensalada_f8ly2t.png";
const MAIL="soportecomebienai@shops.com.ar";
const LEGAL={21:["Política de privacidad",`<p>${APP_NAME} te ayuda a estimar lo que comes a partir de una foto. Esto es lo que hacemos con tus datos, dicho simple.</p>
<h3>Qué guardamos</h3><ul><li>Tu email, para que entres con un código.</li><li>Lo que respondes en el cuestionario: objetivo, sexo, edad, altura, peso, peso objetivo, ritmo, actividad, motivaciones, qué te frena, tipo de cocina, restricciones y tu historial de peso.</li><li>Las comidas que guardas: fecha, hora, tipo de comida, descripción, alimentos con sus porciones, valores nutricionales estimados, veredicto y consejos.</li><li>Cuántos análisis usaste, y tu dirección IP solo para contar usos diarios y evitar abusos.</li></ul>
<h3>Qué no guardamos</h3><p>Las fotos. Se procesan en memoria, se envían a los servicios de IA (ver el siguiente apartado) para analizarlas y no quedan guardadas en nuestros servidores. Tampoco guardamos la lista de ingredientes que escribes para las recetas ni las recetas generadas, salvo que toques «Lo cociné»: en ese caso se guarda como una comida más de tu historial.</p><h3>Qué enviamos a los servicios de IA</h3><p>Para analizar el plato enviamos a Google (Gemini) y, si ese servicio no está disponible, a Groq: <b>la foto</b> y tres preferencias de tu cuestionario (objetivo, tipo de cocina y restricciones alimentarias), para que los consejos se ajusten a ti. <b>No enviamos</b> tu email, nombre, edad, sexo, altura, peso, historial, dirección IP ni identificador de cuenta.</p><p>Para las <b>recetas</b> no se envía ninguna foto: enviamos <b>la lista de ingredientes que escribes</b>, esas mismas tres preferencias y <b>cuántas calorías y macronutrientes te quedan hoy</b> (un número calculado, no tus datos corporales). Tampoco enviamos tu email, nombre, edad, sexo, altura, peso, historial, dirección IP ni identificador de cuenta.</p><p><b>Etapa de pruebas.</b> Mientras ${APP_NAME} está en pruebas, Google procesa las fotos y las listas de ingredientes bajo las condiciones de su servicio gratuito: puede usar el contenido para mejorar sus productos y personas autorizadas pueden revisarlo. Groq las procesa con su modo Zero Data Retention activado: no retiene la imagen, el texto ni la respuesta, y conserva solo metadatos de uso que no incluyen su contenido. Por eso, no fotografíes documentos, personas ni nada que no quieras compartir, y no escribas datos personales en la lista de ingredientes. Cuando el servicio deje de estar en pruebas, pasaremos al servicio de pago de Google, que no usa el contenido para mejorar sus productos, y actualizaremos este aviso.</p>
<h3>Datos de salud</h3><p>Tu peso, objetivo y comidas son datos sensibles. Los usamos solo para calcular tus metas y mostrarte tu progreso e historial. No los vendemos ni los usamos para publicidad.</p>
<h3>Servicios que intervienen</h3><ul><li><b>Google (Gemini) y Groq:</b> reciben la foto (o, en las recetas, la lista de ingredientes) y tus preferencias de objetivo, cocina y restricciones para analizar el plato o armar recetas (detalle arriba). En esta etapa de pruebas Google aplica las condiciones de su servicio gratuito. Cada proveedor tiene su propia política de privacidad. Evita fotografiar documentos o personas.</li><li><b>Supabase:</b> gestiona tu acceso (tu email y el código).</li><li><b>Resend:</b> envía el correo con tu código.</li><li><b>Cloudflare (R2):</b> guarda copias de seguridad diarias de nuestra base de datos, cifradas, para poder recuperarla ante una falla.</li></ul>
<h3>Tus derechos</h3><ul><li>Corregir tus datos: en «Mis datos».</li><li>Borrar tu plan y tu historial: botón «Borrar mi cuenta y mis datos», dentro de «Mis datos». Se elimina al instante.</li><li>Borrar tu email del sistema de acceso, o hacer cualquier consulta: escríbenos a ${MAIL}.</li></ul>
<h3>Qué conservamos tras borrar</h3><p>Un contador de análisis usados, sin tus datos personales, para evitar abusos del uso gratuito. Los contadores diarios por IP se usan solo para limitar el uso.</p><p>Hacemos copias de seguridad diarias cifradas y conservamos las últimas 7. Si borrás tu cuenta, tus datos se eliminan de la app de inmediato, pero pueden permanecer en esas copias hasta 7 días más, hasta que se reemplacen.</p>
<h3>Mayores de edad</h3><p>${APP_NAME} es solo para personas de 18 años o más.</p>
<h3>Cambios</h3><p>Si cambiamos esta política, actualizaremos esta pantalla. Última actualización: octubre de 2026.</p>`],
22:["Términos de uso",`<h3>Es una guía orientativa</h3><p>${APP_NAME} da estimaciones a partir de una foto: pueden fallar o dejar alimentos fuera, y por eso muestran un rango. No es consejo médico ni nutricional, y no reemplaza a un profesional de la salud.</p><p>Las recetas las genera una IA a partir de lo que escribes: pueden contener errores, no verifican alergias ni intolerancias y sus calorías son estimaciones. Revisa siempre los ingredientes y las etiquetas de los productos.</p>
<p>Si tienes una condición médica, estás embarazada o en lactancia, o tienes antecedentes de trastornos de la conducta alimentaria, consulta a un profesional antes de usar la app.</p>
<h3>Quién puede usarla</h3><p>Personas de 18 años o más.</p>
<h3>Uso razonable</h3><p>El uso gratuito tiene un límite de análisis y de búsquedas de recetas por día. No uses la app para automatizar solicitudes, saltarte los límites ni subir fotos de otras personas o documentos.</p>
<h3>Disponibilidad</h3><p>Hacemos lo posible para que funcione, pero no garantizamos que esté siempre disponible ni que las estimaciones sean exactas. Podemos cambiar o retirar funciones.</p>
<h3>Responsabilidad</h3><p>Tomas tus decisiones de alimentación bajo tu propia responsabilidad. En la medida que la ley lo permita, ${APP_NAME} no responde por daños derivados del uso de las estimaciones.</p>
<h3>Contacto</h3><p>${MAIL}</p><p>Última actualización: octubre de 2026.</p>`]};
const legalLinks=()=>'<button class="lnk" data-a="legal" data-v="21">Privacidad</button> · <button class="lnk" data-a="legal" data-v="22">Términos</button>';
const welcome=()=>`<div class="wel">${NOTICE?`<p class="ok" style="margin:0">${esc(NOTICE)}</p>`:""}<div><p class="kick">${APP_NAME}</p><h1>Tu plato, <em>explicado</em> en segundos</h1><p class="lead">Haz una foto y mira calorías y macros estimados. Ajusta las porciones y sigue cuánto te queda del día.</p></div>

function calc(){
  const w=+S.weight,h=+S.height,a=+S.age,m=S.sex===1,g=GOALS[S.goal][0];
  const tdee=(10*w+6.25*h-5*a+(m?5:-161))*ACT[S.act][2];
  let k=tdee;
  if(g==="lose")k=Math.max(tdee-S.pace*1100,m?1500:1200);
  if(g==="gain")k=tdee+S.pace*1100;
  k=Math.round(k/10)*10;
  const prot=Math.round(w*(g==="lose"?2:g==="gain"?1.8:1.6)),fat=Math.round(k*0.27/9);
  const carb=Math.max(0,Math.round((k-prot*4-fat*9)/4));
  const eff=Math.abs(k-tdee)*7/7700;
  const weeks=g!=="keep"&&eff>0.05?Math.abs(w-S.tw)/eff:null;
  return{kcal:k,prot,carb,fat,weeks};
}

    if(!(S.weight>=30&&S.weight<=300))return err("Ingresa tu peso en kg (30 a 300).");
    if(S.goal===0&&S.weight/((S.height/100)**2)<18.5)return err("Con tu peso actual no recomendamos un plan para bajar. Vuelve atrás y elige mantener, o consulta con un profesional.");
  }

    S.tw=+String($.querySelector("#tw").value).replace(",",".")||"";
    const min=Math.ceil(18.5*(S.height/100)**2);
    if(!(S.tw>=30&&S.tw<=300))return err("Ingresa tu peso objetivo en kg.");

    if(S.tw<min)return err(`Para tu altura, elige al menos ${min} kg: es el mínimo saludable.`);
  }
  return true;
}

function progCard(g){

async function syncPlan(){

    return back+`<h2>${esc(KINDS[m.kind]||"Comida")}</h2><p class="sub">${esc(fecha)} · ${new Date(m.ts).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}</p>${m.desc?`<p class="sub" style="margin-top:-10px">${esc(m.desc)}</p>`:""}<div class="kc"><span>aproximadamente</span><div class="big">${+m.kcal||0}</div><span>kcal${mg?` · entre ${lo} y ${hi}`:""}</span></div>`+
    [["Proteínas",m.prot,"var(--prot)"],["Carbohidratos",m.carb,"var(--carb)"],["Grasas",m.fat,"var(--fat)"]].map(([n,v,c])=>`<div style="display:flex;justify-content:space-between;margin:6px 0"><span><span style="color:${c}">●</span> ${n}</span><b>${+v||0} g</b></div>`).join("")+
    (m.items&&m.items.length?`<h2 style="font-size:20px;margin:18px 0 8px">Lo que detectamos</h2>`+m.items.map(it=>`<div class="it"><div style="flex:1;min-width:0"><b>${esc(it.nombre)}</b><small>${esc(it.porcion)}${it.mult&&it.mult!==1?" · ×"+String(it.mult).replace(".",","):""}</small></div><span>${+it.kcal||0} kcal</span></div>`).join(""):"")+
    `<div class="vs"><div><b>Fibra</b>${+m.fibra||0} g</div><div><b>Sodio</b>${+m.sodio||0} mg</div></div>`+
    (m.verdict&&m.verdict[0]?`<div class="ok"><b>Veredicto: ${esc(m.verdict[0])}</b><br>${esc(m.verdict[1])}</div>`:"")+
    (m.tips&&m.tips.length?`<h2 style="font-size:20px;margin:18px 0 6px">Para mejorar</h2><ul style="margin:0;padding-left:20px">${m.tips.map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join("")}</ul>`:"")+
    `<p class="note">Estimación a partir de la foto. No reemplaza a un profesional de la salud.</p>${S.msg2?`<p class="err">${esc(S.msg2)}</p>`:""}<div class="cta"><button class="ghost" data-a="delmeal">${S.confirmDel?"Toca otra vez para borrar esta comida":"Borrar esta comida"}</button></div>`;
  }
  if(s===23){const c=cur,t=tot(c),chip=(x,i)=>`<button class="chip" data-a="add" data-i="${i}">${esc(x[0])} · ${esc(x[1].replace(/^1 /,""))}</button>`;
    const list=c.items.length?c.items.map((it,i)=>{const mu=LV[c.lv[i]];return `<div class="it${mu===0?" off":""}"><div style="flex:1;min-width:0"><b>${esc(it.nombre)}</b><small>${esc(it.porcion)}${mu&&mu!==1?" · ×"+String(mu).replace(".",","):""}${mu===0?" · quitado":""}</small></div><span>${Math.round(it.kcal*mu)} kcal</span><button class="stp" data-a="mult" data-i="${i}" data-d="-1" aria-label="Menos ${esc(it.nombre)}">−</button><button class="stp" data-a="mult" data-i="${i}" data-d="1" aria-label="Más ${esc(it.nombre)}">+</button></div>`}).join(""):'<p class="note">Todavía no agregaste nada. Elige de las listas o escribe uno.</p>';
    return `<div class="top"><button class="back" data-a="discard">Atrás</button></div><h2>Agregar sin foto</h2><p class="sub">Suma a tu día algo que no escaneaste. No gasta análisis.</p><div class="kc"><span>aproximadamente</span><div class="big">${t.kcal}</div><span>kcal</span></div>${list}
    <h3 class="eh">Bebidas</h3><div class="chips">${COMUNES.map((x,i)=>i>=DRINKS0?chip(x,i):"").join("")}<button class="chip" data-a="add" data-i="10">Gaseosa · vaso (250 ml)</button></div>
    <h3 class="eh">Comidas comunes</h3><div class="chips">${COMUNES.map((x,i)=>i<DRINKS0&&i!==10?chip(x,i):"").join("")}</div>
    <h3 class="eh">Otro</h3><div class="row"><label class="f">Nombre<input id="cn" maxlength="60" placeholder="Ej: alfajor"></label><label class="f">Calorías<input id="ck" inputmode="numeric" placeholder="Ej: 250"></label></div>${S.msg?`<p class="err">${esc(S.msg)}</p>`:""}<div class="cta" style="padding-top:8px"><button class="ghost" data-a="addcustom">Agregar este</button></div>
    <p class="note">Valores típicos aproximados (el alcohol cuenta 7 kcal por gramo). Ajusta con − y +; las marcas y los tamaños varían.</p><h3 class="eh">¿Qué comida es?</h3><div class="chips">${KINDS.map((k,i)=>`<button class="chip" data-a="kind" data-i="${i}" aria-pressed="${KIND===i}">${k}</button>`).join("")}</div>`+cta("Guardar en mi día",t.kcal>0,'<button class="ghost" data-a="discard">Descartar</button>').replace('data-a="next"','data-a="savemeal"');}
  if(s===21||s===22)return `<div class="top"><button class="back" data-a="legalback">Atrás</button></div><h2>${LEGAL[s][0]}</h2><div class="lg">${LEGAL[s][1]}</div>`;
  if(s===20){const e=E;
    const fld=(id,l,m)=>`<label class="f">${l}<input id="${id}" inputmode="${m}" value="${esc(e[id])}"></label>`;
    return navBar(20)+`<h2>Mis datos y objetivo</h2><p class="sub">Si cambian tus datos, recalculamos tus metas diarias.</p><h3 class="eh">Objetivo</h3><div class="opts">${GOALS.map((x,i)=>`<button class="opt" data-a="egoal" data-v="${i}" aria-pressed="${e.goal===i}">${x[1]}</button>`).join("")}</div>`+
    `<div class="row" style="margin-top:14px">${fld("age","Edad (años)","numeric")}${fld("height","Altura (cm)","numeric")}${fld("weight","Peso actual (kg)","decimal")}</div>`+
    (e.goal!==1?`<div style="margin-top:12px">${fld("tw","Peso objetivo (kg)","decimal")}</div><div class="opts" style="margin-top:12px">${pacesFor(e.goal).map(p=>`<button class="opt" data-a="epace" data-v="${p[0]}" aria-pressed="${e.pace===p[0]}">${p[1]}<small>${p[2]}</small></button>`).join("")}</div>`:"")+
    `<h3 class="eh">Actividad</h3><div class="opts">${ACT.map((x,i)=>`<button class="opt" data-a="eact" data-v="${i}" aria-pressed="${e.act===i}">${x[0]}<small>${x[1]}</small></button>`).join("")}</div><p class="err" id="err"></p><p class="note">Estimación orientativa (fórmula Mifflin-St Jeor). No reemplaza a un profesional de la salud.</p>`+cta("Guardar y recalcular").replace('data-a="next"','data-a="esave"')+`<div class="danger"><p class="note">${legalLinks()}</p>${S.confirmAcct?`<p class="err" style="margin:10px 0">Se borrarán tu plan y todo tu historial de comidas. No se puede deshacer.</p><div class="cta"><button class="ghost" data-a="delacct" style="color:var(--fat)">Sí, borrar todo</button><button class="ghost" data-a="delcancel">Cancelar</button></div>`:`<div class="cta"><button class="ghost" data-a="delacct" style="color:var(--fat)">Borrar mi cuenta y mis datos</button></div>`}${S.msg3?`<p class="err">${esc(S.msg3)}</p>`:""}</div>`;}
  if(s===15)return `<div class="load" style="text-align:center">${photo?`<img class="pv" src="${photo}" alt="Tu plato">`:""}<h2 style="margin-top:18px">Analizando tu plato…</h2><p class="sub">Identificando alimentos y porciones</p></div>`;
  if(s===14){const c=cur,t=tot(c),T=(t.prot*4+t.carb*4+t.fat*9)||1,C=251.33;let off=0;
    const col=[["Proteínas",t.prot,"var(--prot)",t.prot*4],["Carbohidratos",t.carb,"var(--carb)",t.carb*4],["Grasas",t.fat,"var(--fat)",t.fat*9]];
    const seg=col.map(([n,v,cl,k])=>{const l=k/T*C,r=`<circle cx="60" cy="60" r="40" fill="none" stroke="${cl}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return r}).join("");
    const leg=col.map(([n,v,cl])=>`<div style="display:flex;justify-content:space-between;gap:8px;margin:6px 0"><span><span style="color:${cl}">●</span> ${n}</span><b>${v} g</b></div>`).join("");
    const mg=c.margen||20,lo=Math.round(t.kcal*(1-mg/100)/10)*10,hi=Math.round(t.kcal*(1+mg/100)/10)*10;
    const list=c.editable?`<h2 style="font-size:20px;margin:18px 0 4px">Lo que detectamos</h2><p class="sub" style="margin-bottom:10px">Ajusta las porciones si no coinciden con tu plato.</p>`+c.items.map((it,i)=>{const mu=LV[c.lv[i]];return `<div class="it${mu===0?" off":""}"><div style="flex:1;min-width:0"><b>${esc(it.nombre)}</b><small>${esc(it.porcion)}${mu&&mu!==1?" · ×"+String(mu).replace(".",","):""}${mu===0?" · quitado":""}</small></div><span>${Math.round(it.kcal*mu)} kcal</span><button class="stp" data-a="mult" data-i="${i}" data-d="-1" aria-label="Menos ${esc(it.nombre)}">−</button><button class="stp" data-a="mult" data-i="${i}" data-d="1" aria-label="Más ${esc(it.nombre)}">+</button></div>`}).join(""):"";
    return `${c.demo?'<div class="ok" style="margin:0 0 14px">Datos de ejemplo: aún no se usa la IA real.</div>':""}<img class="pv" src="${photo}" alt="Tu plato"><p class="sub" style="margin-top:12px">${esc(c.desc)}</p><div class="kc"><span>aproximadamente</span><div class="big">${t.kcal}</div><span>kcal · entre ${lo} y ${hi}</span>${mg>=30?'<p class="note" style="margin-top:8px">Plato complejo: revisa la lista y corrige lo que no coincida.</p>':""}</div><div class="m" style="display:flex;align-items:center;gap:14px"><svg width="110" height="110" viewBox="0 0 120 120" role="img" aria-label="Macronutrientes">${seg}</svg><div style="flex:1">${leg}</div></div>${list}${addUI(c)}<div class="vs"><div><b>Fibra</b>${t.fibra} g</div><div><b>Sodio</b>${t.sodio} mg</div></div><div class="ok"><b>Veredicto: ${esc(c.verdict[0])}</b><br>${esc(c.verdict[1])}</div><h2 style="font-size:20px;margin:18px 0 6px">Para mejorar</h2><ul style="margin:0;padding-left:20px">${c.tips.map(x=>`<li style="margin:6px 0">${esc(x)}</li>`).join("")}</ul><p class="note">Es una estimación a partir de la foto. Revisa que estén todos los alimentos y ajusta las porciones. No reemplaza a un profesional de la salud.</p><h2 style="font-size:20px;margin:18px 0 6px">¿Qué comida es?</h2><div class="chips">${KINDS.map((k,i)=>`<button class="chip" data-a="kind" data-i="${i}" aria-pressed="${KIND===i}">${k}</button>`).join("")}</div>`+cta("Guardar en mi día",true,'<button class="ghost" data-a="discard">Descartar</button>').replace('data-a="next"','data-a="savemeal"');}
  return "";
}
// En celulares, "capture" abre la cámara nativa. Las computadoras lo ignoran: ahí usamos la cámara web dentro de la app.
const webcamUI=()=>!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),touchUI=()=>matchMedia("(pointer:coarse)").matches;
let camStream=null;
function closeCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const o=document.getElementById("camov");if(o)o.remove();document.removeEventListener("keydown",camKey)}
const camKey=e=>{if(e.key==="Escape")closeCam()};
async function openCam(){
  closeCam();
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){const alt=touchUI()?"Prueba con «Usar la cámara del teléfono» o elige una foto de la galería.":"Puedes subir una foto desde tus archivos.";S.msg=e&&e.name==="NotAllowedError"?"No pudimos usar la cámara: falta el permiso. Actívalo en los ajustes del sitio en tu navegador. "+alt:"No pudimos abrir la cámara. "+alt;return render()}
  const o=document.createElement("div");o.id="camov";o.className="camov";o.setAttribute("role","dialog");o.setAttribute("aria-label","Cámara");
  o.innerHTML='<video autoplay playsinline muted></video><div class="row2"><button class="x" data-c="x">Cancelar</button><button data-c="snap">Tomar foto</button></div>';
  document.body.appendChild(o);const v=o.querySelector("video");v.srcObject=camStream;v.play().catch(()=>{});
  document.addEventListener("keydown",camKey);
  o.addEventListener("click",e=>{const c=e.target.dataset.c;if(c==="x")closeCam();
    if(c==="snap"){if(!v.videoWidth)return;const cv=document.createElement("canvas");cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext("2d").drawImage(v,0,0);
      cv.toBlob(b=>{closeCam();if(b)scanFile(new File([b],"foto.jpg",{type:"image/jpeg"}))},"image/jpeg",.92)}});
}
document.addEventListener("click",e=>{if(e.target&&e.target.id==="pic")try{localStorage.setItem("comebien:camwait",String(Date.now()))}catch(x){}},true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(()=>{try{localStorage.removeItem("comebien:camwait")}catch(x){}},4000)});
$.addEventListener("change",e=>{
  try{localStorage.removeItem("comebien:camwait")}catch(x){}
  if(e.target.id!=="pic"&&e.target.id!=="gal")return;
  const f=e.target.files[0];e.target.value="";if(f)scanFile(f);
});
async function scanFile(f){
  S.msg="";S.addOpen=false;photo=null;go(15);
  try{photo=await compress(f);render();cur=await analyzeMeal(photo);saveM();KIND=kindNow();go(14)}
  catch(x){if(x.code==="auth"){go(16);return}S.msg=x.code==="quota"?"":(x.message||"No pudimos analizar la foto.");go(13)}
}
$.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const twEl=$.querySelector("#tw");if(twEl&&S.step===5)S.tw=twEl.value;
  const ingEl=$.querySelector("#ing");if(ingEl&&S.step===24)R.ing=ingEl.value;   // no perder lo escrito si cambia de pestaña
  const a=b.dataset.a,k=b.dataset.k,v=b.dataset.v;
  if(a==="inst"){if(deferredPrompt){const d=deferredPrompt;deferredPrompt=null;d.prompt();d.userChoice.finally(render);return}S.tip=!S.tip;return render()}
  if(a==="addtoggle"){S.addOpen=!S.addOpen;return render()}
  if(a==="add"){const x=COMUNES[+b.dataset.i];cur.items.push({nombre:x[0],porcion:x[1],prot:x[2],carb:x[3],fat:x[4],fibra:x[5],sodio:x[6],alc:x[7]||0,kcal:kcalOf(x)});cur.lv.push(3);S.addOpen=false;return render()}
  if(a==="manual"){cur={demo:false,editable:true,desc:"Agregado sin foto",items:[],lv:[],margen:0,verdict:["",""],tips:[]};KIND=kindNow();S.msg="";return go(23)}
  if(a==="addcustom"){const n=($.querySelector("#cn").value||"").trim().slice(0,60),k=Math.round(+String($.querySelector("#ck").value).replace(",","."));
    if(!n||!(k>0&&k<=5000)){S.msg="Escribe el nombre y las calorías (entre 1 y 5000).";return render()}
    cur.items.push({nombre:n,porcion:"1 porción",prot:0,carb:0,fat:0,fibra:0,sodio:0,alc:0,kcal:k});cur.lv.push(3);S.msg="";return render()}
  if(a==="mult"){const i=+b.dataset.i,d=+b.dataset.d;cur.lv[i]=Math.max(0,Math.min(LV.length-1,cur.lv[i]+d));return render()}
  if(a==="legal"){const em=$.querySelector("#em");if(em)S.email=em.value;LEGAL_BACK=S.step;return go(+v)}
  if(a==="legalback")return go(LEGAL_BACK);
  if(a==="delacct"){if(!S.confirmAcct){S.confirmAcct=true;return render()}return delAccount()}
  if(a==="delcancel"){S.confirmAcct=false;return render()}
  if(a==="cam")return openCam();
  if(a==="rec"){R.err="";return go(24)}
  if(a==="recgo")return askRec();
  if(a==="recback"){R.list=null;R.err="";return render()}
  if(a==="cooked"){const r=R.list&&R.list.recetas[+b.dataset.i];if(!r)return;
    M.meals.push({cid:crypto.randomUUID(),day:dayKey(),ts:Date.now(),kind:kindNow(),desc:r.nombre,items:[{nombre:r.nombre,porcion:"1 porción",mult:1,kcal:r.kcal,prot:r.prot,carb:r.carb,fat:r.fat,fibra:r.fibra,sodio:r.sodio}],kcal:r.kcal,prot:r.prot,carb:r.carb,fat:r.fat,fibra:r.fibra,sodio:r.sodio,margen:R.list.margen,verdict:["",""],tips:[],sync:false});
    R.list=null;saveM();go(13);flushPending();return}   // al cocinar cambian las calorías que quedan: los resultados viejos ya no valen
  if(a==="hist")return openHist();
  if(a==="hback"||a==="editback"||a==="gohoy")return go(13);
  if(a==="editp")return openEdit();
  if(a==="egoal"){syncDraft();E.goal=+v;if(!pacesFor(E.goal).some(p=>p[0]===E.pace))E.pace=null;if(E.goal===1)E.tw="";return render()}
  if(a==="epace"){syncDraft();E.pace=+v;return render()}
  if(a==="eact"){syncDraft();E.act=+v;return render()}
  if(a==="esave")return saveEdit();
  if(a==="kind"){KIND=+b.dataset.i;return render()}
  if(a==="meal"){ORIGIN=S.step;S.confirmDel=false;S.msg2="";CUR_ID=b.dataset.c;return go(19)}
  if(a==="navback")return go(ORIGIN);
  if(a==="delmeal"){if(!S.confirmDel){S.confirmDel=true;return render()}return delMeal(CUR_ID)}
  if(a==="loginback")return go(FROMW?0:12);
  if(a==="haveacct"){FROMW=true;FRESH=false;return go(16)}
  if(a==="tologin")return go(16);
  if(a==="logout"){saveSess(null);try{localStorage.removeItem(KEY);localStorage.removeItem("comebien:day");localStorage.removeItem("comebien:planDirty")}catch(e){}M.meals=[];M.used=0;S=blank();FRESH=false;FROMW=false;NOPLAN=false;return go(0)}
  if(a==="sendcode"||a==="resend"){
    const em=a==="sendcode"?$.querySelector("#em").value.trim().toLowerCase():S.email,er=$.querySelector("#err");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){er.textContent="Ingresa un email válido.";return}
    b.disabled=true;er.textContent="";
    sendCode(em).then(()=>{S.email=em;if(a==="resend"){b.disabled=false;er.textContent="Código reenviado."}else go(17)}).catch(e=>{b.disabled=false;er.textContent=e.message});return}
  if(a==="verify"){
    const code=$.querySelector("#code").value.replace(/\D/g,""),er=$.querySelector("#err");
    if(code.length<6){er.textContent="Ingresa el código completo.";return}
    b.disabled=true;er.textContent="";
    verifyCode(S.email,code).then(afterLogin).catch(e=>{b.disabled=false;er.textContent=e.message});return}
  if(a==="discard"){cur=null;return go(13)}
  if(a==="savemeal"){M.meals.push(makeMeal(cur,KIND));saveM();cur=null;go(13);flushPending();return}
  if(a==="back")return go(prev(S.step));
  if(a==="redo"){S={step:1,goal:null,mot:[],sex:null,age:"",height:"",weight:"",tw:"",pace:null,act:null,block:[],cuisine:null,diets:[]};return render()}
  if(a==="next"){
    if(S.step===12){FRESH=true;FROMW=false;NOPLAN=false;if(SESS){const d=readLocal();d&&pushPlan(d).catch(()=>{})}return go(SB&&!SESS?16:13)}
    if(a==="savemeal"){M.meals.push(tot(cur));saveM();cur=null;return go(13)}
    if(!validate())return;
    return go(next(S.step));
  }
  if(k==="pace"){S.pace=+v;return render()}
  const c=Object.values(CH).find(x=>x.k===k);if(!c)return;const i=+v;
  if(c.t==="one"){S[k]=i;if(k==="goal")S.pace=null}
  else{const cur=S[k];
    if(cur.includes(i))S[k]=cur.filter(x=>x!==i);
    else if(c.ex===i)S[k]=[i];
    else{const base=cur.filter(x=>x!==c.ex);S[k]=base.length>=c.max?base:[...base,i]}}
  render();
});
(async()=>{
  try{const c=await(await fetch("/api/config")).json();if(c.supabaseUrl)SB=c}catch(e){}
  try{SESS=JSON.parse(localStorage.getItem("comebien:sess"))}catch(e){SESS=null}
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.goals&&d.profile){S=d.profile;S.step=(SB&&!SESS)?16:13}}catch(e){}
  try{const w=+localStorage.getItem("comebien:camwait");if(w){localStorage.removeItem("comebien:camwait");if(Date.now()-w<6e5&&S.step===13)S.msg="La app se reinició mientras usabas la cámara del teléfono, por eso no se analizó la foto. Prueba con «Escanear plato», que abre la cámara dentro de la app."}}catch(e){}
  render();
  if(SESS)syncPlan();
  loadToday();
  if(!SB||SESS)fetch("/api/quota",{headers:{"x-device-id":DEV,...await authHeaders()}}).then(r=>{if(r.status===401){saveSess(null);if(S.step===13)go(16);return null}return r.ok?r.json():null}).then(j=>{if(j){if(j.free)FREE=j.free;M.used=j.used;if(j.recLeft!=null)R.left=j.recLeft;saveM();if(S.step===24){const t=$.querySelector("#ing");if(t)R.ing=t.value}if(S.step===13||S.step===24)render()}}).catch(()=>{});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.step===13){render();loadToday()}});
  if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
})();
