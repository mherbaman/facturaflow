<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0C2019" />
<meta name="description" content="FacturaFlow · PWA de gestión de facturas: captura OCR, revisión humana y registro definitivo." />
<title>FacturaFlow · Sistema de Gestión de Facturas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230C2019'/%3E%3Cpath d='M20 12h24v40l-4-3.2-4 3.2-4-3.2-4 3.2-4-3.2-4 3.2z' fill='%23F2F5EF'/%3E%3Crect x='14' y='30' width='36' height='4' rx='2' fill='%23D29426'/%3E%3C/svg%3E" />
<style>
/* ============================================================
   FacturaFlow — design system (single-file build)
   ============================================================ */
:root{
  --paper:#F1F4EE; --card:#FBFCF9;
  --ink-900:#10201A; --ink-700:#2C4038; --ink-500:#52675C; --ink-300:#90A498; --ink-200:#C6D2C8; --ink-100:#E4EAE3;
  --pine-950:#071711; --pine-900:#0C2019; --pine-800:#123126; --pine-700:#174434; --pine-600:#1D5942;
  --pine-500:#237050; --pine-400:#37906A; --pine-300:#74B896; --pine-200:#AEDAC3; --pine-100:#DAEEE2; --pine-50:#EDF6F0;
  --warn-700:#8A5A0C; --warn-600:#B27716; --warn-500:#D29426; --warn-100:#F5E6C4; --warn-50:#FAF2DE;
  --danger-700:#9C3A2C; --danger-600:#C24C3A; --danger-100:#F6DCD4; --danger-50:#FBEEEA;
  --sans:system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--ink-200) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--ink-200);border-radius:8px}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);
  background-image:linear-gradient(rgba(16,32,26,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(16,32,26,.035) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink-900); font-family:var(--sans); -webkit-font-smoothing:antialiased; font-size:15px;
}
::selection{background:var(--pine-200);color:var(--pine-900)}
button{font-family:inherit}
img{display:block}
:focus-visible{outline:2px solid var(--pine-500);outline-offset:2px}
.tabular{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid rgba(16,32,26,.1);border-radius:14px;box-shadow:0 1px 2px rgba(16,32,26,.05)}
.card-h{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.card-h:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(12,32,25,.28);border-color:rgba(29,89,66,.35)}
.label{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:10px;font-size:13.5px;font-weight:600;padding:.55rem 1rem;border:1px solid transparent;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s,transform .12s,box-shadow .15s;user-select:none;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn svg{flex:none}
.btn-primary{background:var(--pine-700);color:#F2F7F2;box-shadow:0 1px 2px rgba(7,23,17,.4)}
.btn-primary:hover{background:var(--pine-600)}
.btn-ghost{background:transparent;color:var(--ink-700);border-color:var(--ink-200)}
.btn-ghost:hover{background:var(--pine-50);border-color:var(--pine-300);color:var(--pine-800)}
.btn-danger{background:var(--danger-600);color:#FDF3F0}
.btn-danger:hover{background:var(--danger-700)}
.btn-warn{background:var(--warn-50);color:var(--warn-700);border-color:var(--warn-100)}
.btn-warn:hover{background:var(--warn-100)}
.btn-sm{padding:.35rem .7rem;font-size:12px;border-radius:8px}
.inp{width:100%;border-radius:10px;border:1px solid var(--ink-200);background:var(--card);padding:.55rem .8rem;font-size:14px;color:var(--ink-900);transition:border-color .15s,box-shadow .15s;outline:none;font-family:inherit}
.inp::placeholder{color:var(--ink-300)}
.inp:focus{border-color:var(--pine-500);box-shadow:0 0 0 3px rgba(35,112,80,.16)}
.inp-sm{padding:.35rem .6rem;font-size:12.5px;border-radius:8px}
textarea.inp{resize:vertical;min-height:88px}
select.inp{cursor:pointer}

/* ---------- layout ---------- */
.shell{min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:228px;background:var(--pine-950);display:flex;flex-direction:column;z-index:40}
.side-brand{display:flex;gap:.65rem;align-items:center;padding:1.5rem 1.25rem 1.25rem}
.side-logo{width:40px;height:40px;border-radius:12px;background:var(--pine-800);color:var(--pine-200);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--pine-700)}
.side-name{font-weight:800;font-size:16px;color:var(--pine-50);letter-spacing:-.01em;line-height:1.1}
.side-sub{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--pine-300)}
.side-nav{flex:1;padding:0 .75rem;display:flex;flex-direction:column;gap:4px}
.nav-btn{position:relative;display:flex;align-items:center;gap:.7rem;width:100%;padding:.6rem .8rem;border:0;border-radius:11px;background:none;color:rgba(218,238,226,.72);font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;transition:background .18s,color .18s}
.nav-btn:hover{background:var(--pine-900);color:var(--pine-50)}
.nav-btn.on{background:var(--pine-800);color:var(--pine-50)}
.nav-btn.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:4px;height:20px;border-radius:0 4px 4px 0;background:var(--warn-500)}
.nav-btn.on svg{color:var(--warn-500)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;background:var(--pine-800);color:var(--pine-200);padding:2px 7px;border-radius:99px}
.nav-btn.on .nav-badge{background:var(--warn-500);color:var(--pine-950)}
.side-note{margin:.75rem;border:1px solid var(--pine-800);background:rgba(18,49,38,.5);border-radius:12px;padding:.7rem .85rem}
.side-note p{margin:.25rem 0 0;font-size:11.5px;line-height:1.45;color:rgba(218,238,226,.75)}
.side-user{border-top:1px solid var(--pine-800);padding:.75rem}
.side-user-row{display:flex;align-items:center;gap:.6rem;padding:.4rem .5rem}
.side-user-row .u-n{font-size:13px;font-weight:700;color:var(--pine-50);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user-row .u-r{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--pine-300)}
.icon-btn{border:0;background:none;cursor:pointer;padding:7px;border-radius:9px;color:var(--pine-300);display:inline-flex;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--pine-800);color:var(--pine-50)}
.icon-btn-light{border:1px solid var(--ink-200);background:var(--card);color:var(--ink-500);border-radius:9px;padding:7px;cursor:pointer;display:inline-flex;transition:all .15s}
.icon-btn-light:hover{border-color:var(--pine-300);background:var(--pine-50);color:var(--pine-700)}
.icon-btn-danger:hover{border-color:var(--danger-100);background:var(--danger-50);color:var(--danger-600)}
.main{padding-left:228px}
.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--ink-100);background:rgba(241,244,238,.92);backdrop-filter:blur(4px)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:.75rem;padding:.7rem 2rem}
.topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
.topbar .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500)}
.topbar-spacer{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.32rem .75rem;font-size:11.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip-off{border-color:var(--warn-100);background:var(--warn-50);color:var(--warn-700)}
.chip-sync{border-color:var(--pine-200);background:var(--pine-50);color:var(--pine-700)}
.chip-live{border-color:var(--ink-100);background:var(--card);color:var(--ink-500)}
.dot-live{width:6px;height:6px;border-radius:99px;background:var(--pine-500);animation:pulsedot 2s infinite}
.mnav{display:none;gap:.5rem;overflow-x:auto;padding:0 1rem .7rem}
.mnav .nav-btn{width:auto;flex:none;border:1px solid var(--ink-200);color:var(--ink-700);background:var(--card)}
.mnav .nav-btn.on{background:var(--pine-800);color:var(--pine-50);border-color:var(--pine-800)}
.content{max-width:1200px;margin:0 auto;padding:1.5rem 2rem 1rem}
.foot{max-width:1200px;margin:0 auto;padding:0 2rem 2rem}
.foot p{border-top:1px solid var(--ink-100);padding-top:1rem;text-align:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-300)}

/* ---------- grids & spacing ---------- */
.grid{display:grid;gap:1.25rem}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g32{grid-template-columns:2fr 1fr}
.g23{grid-template-columns:1fr 2fr}
.flex{display:flex;align-items:center}
.wrap{flex-wrap:wrap}
.gap1{gap:.4rem}.gap2{gap:.65rem}.gap3{gap:1rem}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.flex1{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:1.25rem}
.mt0{margin-top:0}.mt1{margin-top:.5rem}.mt2{margin-top:.9rem}.mt3{margin-top:1.25rem}
.mb0{margin-bottom:0}.mb1{margin-bottom:.5rem}.mb2{margin-bottom:.9rem}
.p4{padding:1.1rem}.p5{padding:1.35rem}
.txt-c{text-align:center}

/* ---------- type ---------- */
.h-xl{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
.h-lg{font-size:19px;font-weight:800;letter-spacing:-.015em;margin:0}
.h-md{font-size:15.5px;font-weight:700;margin:0}
.num-big{font-family:var(--mono);font-size:clamp(22px,2.4vw,28px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.mut{color:var(--ink-500)}
.small{font-size:12.5px}
.xs{font-size:11px}

/* ---------- chips de estado ---------- */
.st{display:inline-flex;align-items:center;gap:.4rem;border-radius:99px;padding:.28rem .65rem;font-size:11.5px;font-weight:600;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:99px;display:inline-block}
.st-scanned{background:var(--ink-100);color:var(--ink-700)} .st-scanned i{background:var(--ink-500)}
.st-proc{background:var(--warn-50);color:var(--warn-700);border:1px solid var(--warn-100)} .st-proc i{background:var(--warn-500);animation:softblink 1.2s infinite}
.st-ready{background:var(--pine-100);color:var(--pine-800)} .st-ready i{background:var(--pine-500);animation:pulsedot 2s infinite}
.st-appr{background:var(--pine-700);color:var(--pine-50)} .st-appr i{background:var(--pine-200)}
.st-rej{background:var(--danger-100);color:var(--danger-700)} .st-rej i{background:var(--danger-600)}
.prio{display:inline-flex;align-items:center;gap:.3rem;border-radius:6px;border:1px solid;padding:.1rem .4rem;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.prio-hi{color:var(--danger-600);border-color:var(--danger-100);background:var(--danger-50)}
.prio-md{color:var(--warn-600);border-color:var(--warn-100);background:var(--warn-50)}
.prio-lo{color:var(--ink-500);border-color:var(--ink-100);background:rgba(228,234,227,.6)}
.conf{display:inline-flex;align-items:center;gap:.4rem}
.conf-track{width:40px;height:6px;border-radius:99px;background:var(--ink-100);overflow:hidden;display:inline-block}
.conf-fill{display:block;height:100%;border-radius:99px;transition:width .5s}
.cb-hi{background:var(--pine-500)} .cb-mid{background:var(--warn-500)} .cb-lo{background:var(--danger-600)}
.conf-num{font-family:var(--mono);font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.conf-num.cb-hi{color:var(--pine-700)} .conf-num.cb-mid{color:var(--warn-600)} .conf-num.cb-lo{color:var(--danger-600)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font-weight:700;color:var(--pine-50);flex:none}
.av-0{background:var(--pine-600)}.av-1{background:var(--warn-600)}.av-2{background:var(--pine-800)}.av-3{background:rgba(194,76,58,.85)}

/* ---------- doc preview (anti-colapso) ---------- */
.docprev{position:relative;overflow:hidden;background:linear-gradient(110deg,var(--ink-100) 30%,#f2f5f0 45%,var(--ink-100) 60%);background-size:220% 100%;animation:shimmer 1.4s linear infinite;aspect-ratio:3/4;border-radius:8px}
.docprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.docprev.fit img{object-fit:contain;background:#e8ede7}
.docprev.ok{animation:none;background:#e8ede7}
.docprev.ok img{opacity:1}
.docprev.err{animation:none;background:var(--ink-100)}
.docprev.err::after{content:"sin vista previa";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-300)}
.doc-th{width:44px;height:56px;aspect-ratio:auto;border-radius:6px;border:1px solid var(--ink-200);flex:none}
.doc-th-s{width:30px;height:38px;aspect-ratio:auto;border-radius:5px;border:1px solid var(--ink-200);flex:none}

/* ---------- pipeline ---------- */
.pipe{display:grid;grid-template-columns:1fr 40px 1fr 40px 1fr 40px 1fr;align-items:stretch}
.pipe-node{padding:1rem .9rem;text-align:left;display:flex;flex-direction:column;gap:.3rem;min-width:0}
.pipe-node .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-500)}
.pipe-node .val{font-family:var(--mono);font-size:clamp(20px,2.2vw,26px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pipe-node.hot{background:var(--pine-50);border-color:var(--pine-300)}
.pipe-node.hot .val{color:var(--pine-800)}
.pipe-node.final{background:var(--pine-800);border-color:var(--pine-800)}
.pipe-node.final .lbl{color:var(--pine-200)}
.pipe-node.final .val{color:var(--pine-50)}
.pipe-link{display:flex;align-items:center;justify-content:center}
.pipe-link svg{overflow:visible}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--ink-100);background:var(--paper);font-weight:600}
.tbl td{padding:.6rem .8rem;border-bottom:1px solid var(--ink-100);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:rgba(237,246,240,.6)}
.tbl .r{text-align:right}
.rowcard{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem}
.rowcard+.rowcard{border-top:1px solid var(--ink-100)}
.rowcard:hover{background:rgba(237,246,240,.55)}

/* ---------- lists / timeline ---------- */
.tl{position:relative;padding-left:0}
.tl-item{position:relative;display:flex;gap:.85rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--ink-100);transition:background .15s}
.tl-item:last-child{border-bottom:0}
.tl-item:hover{background:rgba(237,246,240,.55)}
.tl-item::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--ink-100)}
.tl-item:last-child::before{display:none}
.tl-dot{position:relative;z-index:1;width:28px;height:28px;flex:none;border-radius:99px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--card)}

/* ---------- scanner ---------- */
.dropz{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;padding:3rem 1.5rem;text-align:center;cursor:pointer;min-height:320px}
.dropz::before{content:"";position:absolute;inset:12px;border:2px dashed var(--ink-200);border-radius:12px;transition:border-color .2s,background .2s;pointer-events:none}
.dropz.drag::before{border-color:var(--pine-500);background:var(--pine-50)}
.dropz-ic{width:64px;height:64px;border-radius:18px;background:var(--pine-100);color:var(--pine-700);display:flex;align-items:center;justify-content:center;transition:transform .25s,background .25s,color .25s}
.dropz.drag .dropz-ic{transform:scale(1.1);background:var(--pine-600);color:var(--pine-50)}
.scan-stage{position:relative;aspect-ratio:16/10;background:var(--pine-950);overflow:hidden}
.scan-paper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:210px;background:var(--card);border-radius:6px;box-shadow:0 20px 50px rgba(0,0,0,.45);padding:1rem}
.scan-paper i{display:block;height:8px;border-radius:4px;background:var(--ink-100);margin-bottom:9px}
.scan-paper i:first-child{width:70%;background:var(--ink-200)}
.scan-paper i:nth-child(5){margin-top:22px}
.scanline{position:absolute;left:0;right:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--pine-400),var(--warn-500),transparent);box-shadow:0 0 14px rgba(55,144,106,.75);animation:scanmove 2.3s ease-in-out infinite}
.scan-frame{position:absolute;inset:28px;border:2px dashed rgba(116,184,150,.5);border-radius:10px;pointer-events:none}
.stage-row{display:flex;align-items:center;gap:.65rem}
.stage-dot{width:24px;height:24px;flex:none;border-radius:99px;border:1px solid var(--ink-200);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-300);background:var(--card);transition:all .3s}
.stage-dot.done{border-color:var(--pine-500);background:var(--pine-500);color:#fff}
.stage-dot.now{border-color:var(--warn-500);background:var(--warn-50);color:var(--warn-600)}
.field{margin-bottom:.35rem}
.kv{border-radius:9px;border:1px solid var(--ink-100);background:rgba(241,244,238,.7);padding:.35rem .65rem;font-family:var(--mono);font-size:12.5px;font-weight:600}

/* ---------- review ---------- */
.banner{display:flex;gap:.65rem;align-items:flex-start;border-radius:12px;padding:.75rem 1rem;font-size:13px}
.banner-ok{border:1px solid var(--pine-200);background:var(--pine-50);color:var(--pine-800)}
.banner-err{border:1px solid var(--danger-100);background:var(--danger-50);color:var(--danger-700)}
.banner-warn{border:1px solid var(--warn-100);background:var(--warn-50);color:var(--warn-700)}
.check{display:flex;gap:.5rem;align-items:center;font-size:12.5px;font-weight:500}
.check.ok{color:var(--pine-700)} .check.no{color:var(--danger-600)}
.zoomdoc{transition:transform .2s;transform-origin:top center;max-width:520px;margin:0 auto}
.stamp{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(237,246,240,.25)}
.stamp span{border:4px solid var(--pine-700);color:var(--pine-700);background:rgba(237,246,240,.9);border-radius:12px;padding:.8rem 2rem;font-weight:800;font-size:28px;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 14px 40px rgba(7,23,17,.35);animation:stampin .45s cubic-bezier(.2,1.4,.4,1) both}
.edcell{border:0;background:transparent;padding:.25rem .4rem;font-size:12px;width:100%;font-family:inherit;color:var(--ink-900);border-radius:6px;outline:none}
.edcell:focus{background:var(--pine-50);box-shadow:inset 0 0 0 1.5px var(--pine-400)}
.edcell.r{text-align:right;font-family:var(--mono)}
.fchip{display:inline-flex;align-items:center;gap:.35rem;border-radius:6px;padding:.2rem .5rem;font-family:var(--mono);font-size:10.5px;font-weight:600}
.fchip-ok{background:var(--pine-100);color:var(--pine-800)}
.fchip-no{background:var(--danger-100);color:var(--danger-700)}
.fchip-warn{background:var(--warn-100);color:var(--warn-700)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-side{background:var(--pine-950);color:var(--pine-50);padding:3rem;display:flex;flex-direction:column;position:relative;overflow:hidden}
.login-side::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(116,184,150,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(116,184,150,.06) 1px,transparent 1px);background-size:30px 30px}
.login-side>*{position:relative}

  "Hostelería": [
    { desc: "Café en grano 1 kg tueste natural", min: 15, max: 21 },
    { desc: "Caja 6 botellas agua mineral 1,5 l", min: 3.4, max: 4.6 },
  ],
  "Marketing": [
    { desc: "Impresión 1.000 folletos A5 color", min: 95, max: 140 },
    { desc: "Campaña SEM (gestión mensual)", min: 180, max: 260 },
  ],
};
const CAT_KEYS = Object.keys(CATALOG);

function buildExtracted(seed) {
  const rnd = mulberry32(seed);
  const sup = SUPPLIERS[Math.floor(rnd() * SUPPLIERS.length)];
  const cat = CAT_KEYS[Math.floor(rnd() * CAT_KEYS.length)];
  const options = CATALOG[cat];
  const count = 2 + Math.floor(rnd() * 2);
  const items = [];
  for (let i = 0; i < count; i++) {
    const o = options[Math.floor(rnd() * options.length)];
    items.push({ description: o.desc, qty: 1 + Math.floor(rnd() * 6), unit_price: round2(o.min + rnd() * (o.max - o.min)) });
  }
  const subtotal = round2(items.reduce((a, i) => a + i.qty * i.unit_price, 0));
  const tax_amount = round2((subtotal * sup.tax) / 100);
  const year = new Date().getFullYear() - (rnd() < 0.85 ? 0 : 1);
  const doy = Math.floor(rnd() * 340);
  const invoice_date = dateStr(new Date(new Date(year, 0, 1).getTime() + doy * 864e5));
  const due_date = dateStr(new Date(new Date(invoice_date + "T12:00:00").getTime() + [15, 30, 60][Math.floor(rnd() * 3)] * 864e5));
  return {
    invoice_number: "F-" + String(year).slice(2) + pad2(Math.floor(doy / 28) + 1) + "-" + String(1000 + Math.floor(rnd() * 9000)),
    supplier_name: sup.name, supplier_tax_id: sup.nif, invoice_date: invoice_date, due_date: due_date,
    subtotal: subtotal, tax_rate: sup.tax, tax_amount: tax_amount, total: round2(subtotal + tax_amount),
    currency: "EUR", category: cat, items: items,
  };
}

function synthInvoice(idx) { const e = buildExtracted(1000 + idx * 977); return { extracted: e, docUrl: invoiceDocSVG(e) }; }

function confidences(seed) {
  const rnd = mulberry32(seed ^ 0x9e3779b9);
  const c = () => round2(0.72 + rnd() * 0.27);
  return { invoice_number: c(), supplier_name: c(), supplier_tax_id: c(), invoice_date: c(), due_date: c(), subtotal: c(), tax_rate: c(), tax_amount: c(), total: c(), category: c(), items: c() };
}
const avgConf = m => { const v = Object.values(m).filter(x => typeof x === "number"); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
const OCR_STAGES = [
  { label: "Preprocesando imagen" },
  { label: "Detectando regiones de texto" },
  { label: "Extrayendo caracteres" },
  { label: "Identificando campos de factura" },
  { label: "Validando importes" },
];
async function performOCR(name, size, dataUrl, onStage) {
  const seed = hashStr(name) + (size % 9973);
  for (let i = 0; i < OCR_STAGES.length; i++) { onStage(i); await wait(340 + Math.random() * 300); }
  const isPdf = /\.pdf$/i.test(name);
  const extracted = buildExtracted(seed);
  return {
    extracted: extracted,
    confidence: confidences(seed),
    docUrl: (!isPdf && dataUrl) ? dataUrl : invoiceDocSVG(extracted),
    lines: 18 + (seed % 24),
    source: (!isPdf && dataUrl) ? "upload" : "synthetic",
  };
}
function fileToDataUrl(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error("read")); r.readAsDataURL(file); });
}
function downscaleImage(dataUrl, maxSide) {
  maxSide = maxSide || 1100;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      if (scale === 1 && dataUrl.length < 600000) return res(dataUrl);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      if (!ctx) return res(dataUrl);
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

let DB;
function loadDb() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.version === 1 && Array.isArray(p.users)) return p; }
  } catch (e) { /* re-seed */ }
  const fresh = seedDb();
  try { localStorage.setItem(DB_KEY, JSON.stringify(fresh)); } catch (e) { /* cuota */ }
  return fresh;
}
DB = loadDb();
function persist() { try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); } catch (e) { /* memoria */ } }
function audit(user, action, table, rid, detail) {

function apiLogin(email, password) {

  if (!u || u.password !== password) throw new Error("Credenciales no válidas. Prueba con una cuenta demo.");

function apiCreateScan(input, user) {
  const rec = {
    id: uid(), original_filename: input.filename, file_url: input.previewUrl, extracted: input.extracted,
    confidence: input.confidence, ocr_lines: input.ocr_lines, status: "processing", scanned_by: user.id,
    scanned_at: new Date().toISOString(), priority: input.priority, notes: input.notes, assigned_reviewer: null,
    synced: S.online,
  };
  DB.pending.unshift(rec);
  audit(user, "invoice.scan", "invoices_pending", rec.id, input.extracted.invoice_number + " capturada · OCR finalizado");
  save();
  setTimeout(() => {
    const p = pendingById(rec.id);
    if (p && p.status === "processing") {
      p.status = "ready_for_review";
      audit(user, "invoice.ready", "invoices_pending", p.id, p.extracted.invoice_number + " lista para revisión humana");
      save();
    }

function apiAssign(id, reviewerId, user) {
  const p = pendingById(id); if (!p) throw new Error("Factura no encontrada");
  p.assigned_reviewer = reviewerId || null;
  const r = reviewerId ? userById(reviewerId) : null;
  audit(user, "invoice.assign", "invoices_pending", id, r ? p.extracted.invoice_number + " asignada a " + r.full_name : p.extracted.invoice_number + " liberada (sin asignar)");

function apiApprove(id, validated, user) {
  const p = pendingById(id); if (!p) throw new Error("Factura no encontrada");
  if (p.status === "approved") throw new Error("Esta factura ya fue aprobada");
  if (p.status === "rejected") throw new Error("No se puede aprobar una factura rechazada");
  const now = new Date().toISOString();
  const approved = {
    id: uid(), pending_id: p.id, invoice_number: validated.invoice_number, supplier_name: validated.supplier_name,
    supplier_tax_id: validated.supplier_tax_id, amount: validated.total, currency: validated.currency,
    tax_amount: validated.tax_amount, subtotal: validated.subtotal, invoice_date: validated.invoice_date,
    due_date: validated.due_date, category: validated.category,
    description: validated.items.map(i => i.description).join(" · ").slice(0, 160), file_url: p.file_url,
    reviewed_by: user.id, reviewed_at: now, approved_at: now,
    cycle_minutes: Math.max(4, Math.round((Date.now() - new Date(p.scanned_at).getTime()) / 60000)), synced: true,
  };
  DB.approved.unshift(approved);
  p.status = "approved";
  if (!p.assigned_reviewer) p.assigned_reviewer = user.id;
  audit(user, "invoice.approve", "invoices_approved", approved.id, approved.invoice_number + " · " + approved.supplier_name + " · " + eur(approved.amount));
  save();
  return approved;
}
function apiReject(id, reason, user) {
  const p = pendingById(id); if (!p) throw new Error("Factura no encontrada");
  p.status = "rejected"; p.reject_reason = reason;
  audit(user, "invoice.reject", "invoices_pending", id, p.extracted.invoice_number + " · " + reason);

function apiDeleteApproved(id, user) {
  const rec = DB.approved.find(a => a.id === id); if (!rec) throw new Error("Registro no encontrado");
  DB.approved = DB.approved.filter(a => a.id !== id);

function apiCreateUser(input, admin) {
  const email = String(input.email).trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) throw new Error("El formato del correo no es válido");
  if (DB.users.some(u => u.email.toLowerCase() === email)) throw new Error("Ya existe un usuario con ese correo");

  if (pass.length < 6) throw new Error("La contraseña debe tener al menos 6 caracteres");
  const u = userById(id); if (!u) throw new Error("Usuario no encontrado");
  u.password = pass;

  if (user.password !== current) throw new Error("La contraseña actual no es correcta");

  const u = userById(user.id); if (!u) throw new Error("Usuario no encontrado");
  u.password = next;
  audit(u, "user.update", "users", u.id, "Contraseña actualizada por el propio usuario");
  save();
}

/* ---------------- sincronización offline ---------------- */
async function processOutbox() {
  if (S.syncing || !S.online || !DB.outbox.length) return;
  S.syncing = true; render();
  const items = DB.outbox.slice();
  let ok = 0;
  for (const it of items) {
    await wait(450);
    if (it.kind === "approve") {
      const p = pendingById(it.payload.id);
      if (p && p.status !== "approved") { apiApprove(it.payload.id, p.extracted, S.user); ok++; }
    } else if (it.kind === "reject") {
      const p = pendingById(it.payload.id);
      if (p && p.status !== "rejected") { apiReject(it.payload.id, it.payload.reason || "Rechazada durante modo offline", S.user); ok++; }
    } else if (it.kind === "scan") {
      const p = pendingById(it.payload.id);
      if (p && !p.synced) { p.synced = true; audit(S.user, "invoice.ready", "invoices_pending", p.id, p.extracted.invoice_number + " sincronizada con el servidor"); save(); ok++; }
    }
    DB.outbox = DB.outbox.filter(o => o.id !== it.id);
    persist();
  }
  S.syncing = false;
  render();
  toast("ok", ok + (ok === 1 ? " acción sincronizada" : " acciones sincronizadas") + " con el servidor");
}

window.docOk = function (el) { const w = el.closest(".docprev"); if (w) w.classList.add("ok"); };
window.docErr = function (el) { const w = el.closest(".docprev"); if (w) { w.classList.add("err"); el.style.display = "none"; } };
function docPrev(src, cls, alt, fit) {
  return '<div class="docprev ' + (fit ? "fit " : "") + (cls || "") + '">' +
    '<img src="' + src + '" alt="' + esc(alt || "Documento") + '" onload="docOk(this)" onerror="docErr(this)"></div>';
}
const ST = {
  scanned: ["Escaneada", "st-scanned"], processing: ["Procesando", "st-proc"],
  ready_for_review: ["Lista para revisión", "st-ready"], approved: ["Aprobada", "st-appr"], rejected: ["Rechazada", "st-rej"],
};
function statusChip(s) { const m = ST[s] || ST.scanned; return '<span class="st ' + m[1] + '"><i></i>' + m[0] + "</span>"; }
function prioChip(p) {
  const m = { high: ["prio-hi", "Alta"], medium: ["prio-md", "Media"], low: ["prio-lo", "Baja"] }[p] || ["prio-md", "Media"];
  return '<span class="prio ' + m[0] + '">' + m[1] + "</span>";
}
function confBar(v) {
  const pct = Math.round((v || 0) * 100);
  const c = pct >= 85 ? "cb-hi" : pct >= 70 ? "cb-mid" : "cb-lo";
  return '<span class="conf"><span class="conf-track"><span class="conf-fill ' + c + '" style="width:' + pct + '%"></span></span><span class="conf-num ' + c + '">' + pct + "%</span></span>";
}
function avatar(name, size) {
  const ini = String(name).split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const h = (String(name).length * 7) % 4;
  return '<span class="av av-' + h + '" style="width:' + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.36) + 'px">' + esc(ini) + "</span>";
}
function emptyState(icon, title, hint) {
  return '<div class="empty anim"><span class="empty-ic">' + icon + '</span><p class="h-md" style="color:var(--ink-700)">' + title + "</p>" +
    (hint ? '<p class="small mut" style="max-width:340px;margin:.2rem 0 0">' + hint + "</p>" : "") + "</div>";
}
function countUp(el) {
  const to = parseFloat(el.dataset.to) || 0;
  const dec = parseInt(el.dataset.dec || "0", 10);
  const fmt = el.dataset.fmt === "eur";
  const start = performance.now(), dur = 800;
  const step = t => {
    const k = Math.min(1, (t - start) / dur);
    const v = to * (1 - Math.pow(1 - k, 3));
    el.textContent = fmt ? eur(v) : v.toLocaleString("es-ES", { maximumFractionDigits: dec, minimumFractionDigits: dec });
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

      '<tr style="background:var(--paper)"><td colspan="2" class="xs" style="font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)">base ' + eur(r.extracted.subtotal) + " · IVA " + r.extracted.tax_rate + ' %</td><td class="r mono" style="font-weight:800;color:var(--pine-800)">' + eur(r.extracted.total) + "</td></tr>" +
      "</tbody></table></div>" +
      '<div class="grid g2 gap2 mt2"><div><label class="label mb1" style="display:block">prioridad</label><select class="inp" data-sel="prio"><option value="high"' + (S.prio === "high" ? " selected" : "") + ">Alta</option><option value=\"medium\"" + (S.prio === "medium" ? " selected" : "") + ">Media</option><option value=\"low\"" + (S.prio === "low" ? " selected" : "") + ">Baja</option></select></div>" +
      '<div><label class="label mb1" style="display:block">nota (opcional)</label><input class="inp" id="scan-notes" placeholder="contexto para el revisor…" value="' + esc(S.notes) + '"></div></div></div>' +
      '<div class="flex gap2" style="padding:.8rem 1.1rem;border-top:1px solid var(--ink-100);background:rgba(241,244,238,.7)">' +
      '<button class="btn btn-ghost" data-act="scan-discard">' + IC.x + ' Descartar</button>' +
      '<button class="btn btn-primary flex1" data-act="scan-send" ' + (S.scanBusy ? "disabled" : "") + ">" + (S.scanBusy ? '<span class="spin" style="display:flex">' + IC.spinner + "</span>" : IC.arrowr) + " Enviar a DB transitoria</button>" +
      "</div></div></div>";
  }
  /* pick */
  const demos = [0, 1, 2].map(i => synthInvoice(i + 40 + ((S.user.id.length || 3) % 5)));
  return '<div class="grid g32">' +
    '<div class="card card-h anim"><div class="dropz" id="dropz" data-act="pick-file">' +
      '<span class="dropz-ic">' + IC.upload + "</span>" +
      '<div><p class="h-md" id="dropz-title">Arrastra una factura</p><p class="small mut mt1" style="margin:.3rem 0 0">JPG, PNG, WEBP o PDF · máx. 12 MB · el OCR se ejecuta en tu dispositivo</p></div>' +
      '<div class="flex gap2 wrap" style="justify-content:center">' +
      '<button class="btn btn-primary" data-act="pick-file">' + IC.upload + ' Elegir archivo</button>' +
      '<button class="btn btn-ghost" data-act="cam-open">' + IC.camera + " Usar cámara</button></div>" +
      '<input type="file" id="file-in" accept="image/*,application/pdf" style="display:none">' +
    "</div></div>" +
    '<div class="card anim d1 p5" style="display:flex;flex-direction:column"><p class="label">facturas de demostración</p>' +
    '<p class="xs mut mt1" style="margin:.3rem 0 0">Generan un documento realista y ejecutan el pipeline OCR completo.</p>' +
    '<div class="col gap2 mt2">' + demos.map((s, i) =>
      '<button class="card card-h rowcard" style="cursor:pointer;border:1px solid rgba(16,32,26,.1)" data-act="scan-demo" data-idx="' + i + '">' +
      '<span class="av av-2" style="width:38px;height:38px;font-size:14px;background:var(--pine-800)">' + IC.zap + "</span>" +
      '<span class="flex1" style="text-align:left"><span style="display:block;font-weight:700;font-size:13px">' + esc(s.extracted.supplier_name) + '</span><span class="mono xs mut">' + esc(s.extracted.invoice_number) + " · " + eur(s.extracted.total) + "</span></span>" +
      '<span style="color:var(--ink-300)">' + IC.arrowr + "</span></button>").join("") + "</div>" +
    '<div style="margin-top:auto;padding-top:1rem"><div class="card" style="background:rgba(241,244,238,.7);padding:.8rem 1rem">' +
      '<div class="flex between"><span class="small" style="font-weight:700">Tus capturas</span><span class="mono" style="font-weight:700;color:var(--pine-700)">' + myScans + '</span></div>' +
      '<p class="mono xs mut" style="margin:.25rem 0 0">POST /api/invoices/scan → invoices_pending</p></div></div></div></div>';
}

function reviewQueue() {
  const all = can("view_all_invoices");
  const base = all ? DB.pending : DB.pending.filter(p => p.scanned_by === S.user.id);
  const filters = [["all", "Todas"], ["ready_for_review", "Listas"], ["processing", "Procesando"], ["scanned", "Escaneadas"], ["rejected", "Rechazadas"]];
  const F_ORDER = { ready_for_review: 0, processing: 1, scanned: 2, rejected: 3, approved: 4 };
  const P_ORDER = { high: 0, medium: 1, low: 2 };
  let list = base.slice();
  const f = S.fQ || "all";
  if (f !== "all") list = list.filter(p => p.status === f);
  if (S.qQueue.trim()) { const t = S.qQueue.trim().toLowerCase(); list = list.filter(p => p.extracted.supplier_name.toLowerCase().includes(t) || p.extracted.invoice_number.toLowerCase().includes(t) || p.original_filename.toLowerCase().includes(t)); }
  list.sort((a, b) => (F_ORDER[a.status] - F_ORDER[b.status]) || (P_ORDER[a.priority] - P_ORDER[b.priority]) || (new Date(b.scanned_at) - new Date(a.scanned_at)));
  const reviewers = DB.users.filter(u => u.role !== "scanner" && u.is_active);

  return '<div>' +
    '<div class="flex wrap gap2 between anim mb2">' +
    '<div class="filters">' + filters.map(x => {
      const cnt = x[0] === "all" ? base.length : base.filter(p => p.status === x[0]).length;
      return '<button class="fbtn ' + (f === x[0] ? "on" : "") + '" data-act="qfilter" data-f="' + x[0] + '">' + x[1] + '<span class="n">' + cnt + "</span></button>";
    }).join("") + "</div>" +
    '<div class="searchwrap" style="width:min(100%,260px)">' + IC.search + '<input class="inp inp-sm" id="q-queue" placeholder="Proveedor, nº, archivo…" value="' + esc(S.qQueue) + '" data-q="queue"></div></div>' +
    (!all ? '<div class="banner banner-ok anim mb2">' + IC.users + "<span>Estás viendo solo tus capturas · la aprobación corresponde a revisión y administración.</span></div>" : "") +
    '<div id="qlist">' + (list.length === 0
      ? '<div class="card">' + emptyState(IC.inbox, "Nada por aquí", S.qQueue ? "Sin resultados para «" + esc(S.qQueue) + "»." : "No hay facturas en este estado. La cola está al día.") + "</div>"
      : '<div class="card anim d1">' + list.map((p, i) => {
        const asg = p.assigned_reviewer ? userById(p.assigned_reviewer) : null;
        return '<div class="rowcard anim d' + Math.min(i + 1, 6) + '" style="align-items:center">' +
          '<button style="border:0;background:none;padding:0;cursor:pointer" data-act="open-review" data-id="' + p.id + '">' + docPrev(p.file_url, "doc-th", p.extracted.invoice_number) + "</button>" +
          '<button class="flex1" style="border:0;background:none;padding:0;cursor:pointer;text-align:left;min-width:0" data-act="open-review" data-id="' + p.id + '">' +
          '<span class="flex gap2 wrap"><strong style="font-size:14.5px">' + esc(p.extracted.supplier_name) + "</strong>" + prioChip(p.priority) + "</span>" +
          '<span class="mono xs mut" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem"><span>' + esc(p.extracted.invoice_number) + "</span><span>·</span><span>" + timeAgo(p.scanned_at) + "</span>" +
          (asg ? '<span style="color:var(--pine-700)">· ' + esc(asg.full_name.split(" ")[0]) + " asignado</span>" : "") +
          (p.reject_reason ? '<span style="color:var(--danger-600)">· ' + esc(p.reject_reason.slice(0, 44)) + "…</span>" : "") + "</span></button>" +
          '<div class="flex gap2" style="flex-wrap:wrap">' +
          '<span style="text-align:right"><span class="mono" style="display:block;font-weight:700;font-variant-numeric:tabular-nums">' + eur(p.extracted.total) + '</span><span class="xs mut">conf. ' + Math.round(avgConf(p.confidence) * 100) + ' %</span></span>' +
          statusChip(p.status) +
          (can("assign_invoices") && !p.assigned_reviewer && p.status === "ready_for_review"
            ? '<select class="inp inp-sm" style="width:auto" data-sel="assign" data-id="' + p.id + '"><option value="" selected disabled>Asignar…</option>' + reviewers.map(r => '<option value="' + r.id + '">' + esc(r.full_name) + "</option>").join("") + "</select>" : "") +
          '<button class="btn btn-ghost btn-sm" data-act="open-review" data-id="' + p.id + '">Abrir " + IC.chevl + "</button>' +
          "</div></div>";
      }).join("") + "</div>") + "</div></div>";
}

function reviewDetail() {
  const rec = pendingById(S.reviewId);
  if (!rec) return reviewQueue();
  const u = S.user;
  const editable = can("approve_invoices") && rec.status !== "approved" && rec.status !== "rejected";
  const e = ED;
  const itemsTotal = round2(e.items.reduce((a, it) => a + it.qty * it.unit_price, 0));
  const expectedTax = round2((e.subtotal * e.tax_rate) / 100);
  const totalsMismatch = Math.abs(e.subtotal + e.tax_amount - e.total) > 0.02;
  const taxMismatch = Math.abs(expectedTax - e.tax_amount) > 0.05;
  const errors = [];
  if (!e.supplier_name.trim()) errors.push("El proveedor es obligatorio");
  if (!e.invoice_number.trim()) errors.push("El número de factura es obligatorio");
  if (!e.invoice_date) errors.push("Falta la fecha de emisión");
  if (e.due_date && e.invoice_date && e.due_date < e.invoice_date) errors.push("El vencimiento es anterior a la emisión");
  if (e.total <= 0) errors.push("El total debe ser mayor que cero");
  if (totalsMismatch) errors.push("Base + IVA no cuadra con el total");
  const lowFields = Object.entries(rec.confidence).filter(kv => kv[1] < 0.75);
  const conf = rec.confidence;
  const scanner = userById(rec.scanned_by);
  const reviewers = DB.users.filter(x => x.role !== "scanner" && x.is_active);

  const field = (lbl, confV, inner) => '<div class="field"><div class="flex between mb1"><span class="label" style="font-size:9.5px">' + lbl + "</span>" + (confV != null ? confBar(confV) : "") + "</div>" + inner + "</div>";
  const inp = (k, type, cls) => '<input class="inp inp-sm ' + (cls || "") + '" type="' + (type || "text") + '" data-f="' + k + '" value="' + esc(e[k]) + '" ' + (editable ? "" : "readonly") + ">";

  const checks = [
    [!!e.supplier_name.trim() && !!e.invoice_number.trim(), "Proveedor y número identificados"],
    [!!e.invoice_date && (!e.due_date || e.due_date >= e.invoice_date), "Fechas coherentes"],
    [!totalsMismatch && e.total > 0, "Totales cuadran con el documento"],
    [lowFields.length === 0, "Confianza OCR suficiente en todos los campos"],
  ];

  return '<div class="stack">' +
    '<div class="flex wrap gap2 between anim">' +
    '<button class="btn btn-ghost btn-sm" data-act="back-queue">' + IC.chevl + " Volver a la cola</button>" +
    '<div class="flex1" style="min-width:220px"><h2 class="flex gap2 wrap" style="font-size:19px;font-weight:800;margin:0">' + esc(e.supplier_name || "—") + " " + statusChip(rec.status) + " " + prioChip(rec.priority) + "</h2>" +
    '<p class="mono xs mut" style="margin:.3rem 0 0">' + esc(e.invoice_number) + " · capturada por " + esc(scanner ? scanner.full_name : "—") + " " + timeAgo(rec.scanned_at) + " · " + esc(rec.original_filename) + "</p></div>" +
    (can("assign_invoices") && rec.status !== "approved" && rec.status !== "rejected"
      ? '<div class="flex gap1">' + IC.users + '<select class="inp inp-sm" style="width:auto" data-sel="assign-detail" data-id="' + rec.id + '"><option value=""' + (!rec.assigned_reviewer ? " selected" : "") + ">Sin asignar</option>" + reviewers.map(r => '<option value="' + r.id + '"' + (rec.assigned_reviewer === r.id ? " selected" : "") + ">" + esc(r.full_name) + "</option>").join("") + "</select></div>" : "") +
    "</div>" +

    (rec.status === "rejected" ? '<div class="banner banner-err anim d1">' + IC.x + "<span><strong>Rechazada.</strong> " + esc(rec.reject_reason || "") + " · No pasará a la DB definitiva.</span></div>" : "") +
    (rec.status === "approved" ? '<div class="banner banner-ok anim d1">' + IC.check + "<span><strong>Registrada en la DB definitiva.</strong> Puedes consultarla en el módulo «Definitivas».</span></div>" : "") +
    (rec.status === "processing" ? '<div class="banner banner-warn anim d1"><span class="spin" style="display:flex">' + IC.sync + "</span><span>El procesado posterior al OCR sigue en curso · pasará a «Lista para revisión» en unos segundos.</span></div>" : "") +

    '<div class="grid g2" style="align-items:start">' +
    '<div class="card anim d1" style="overflow:hidden"><div class="flex between" style="padding:.65rem 1.1rem;border-bottom:1px solid var(--ink-100)"><p class="label">documento original</p>' +
    '<div class="flex gap1"><button class="btn btn-ghost btn-sm" data-act="zoom" data-dir="-1" aria-label="Alejar">−</button><span class="mono xs mut" style="min-width:44px;text-align:center">' + Math.round(S.zoom * 100) + ' %</span><button class="btn btn-ghost btn-sm" data-act="zoom" data-dir="1" aria-label="Acercar">+</button></div></div>' +
    '<div style="max-height:600px;overflow:auto;background:rgba(228,234,227,.5);padding:1.2rem"><div style="position:relative">' +
    '<div class="zoomdoc" style="transform:scale(' + S.zoom + ')">' + docPrev(rec.file_url, "", "Documento " + esc(e.invoice_number), true) + "</div>" +
    (S.modal && S.modal.type === "stamped" && S.modal.id === rec.id ? '<div class="stamp"><span>Registrada</span></div>' : "") +
    "</div></div>" +
    (rec.notes ? '<p class="small" style="margin:0;padding:.65rem 1.1rem;border-top:1px solid var(--ink-100);background:rgba(250,242,222,.6)"><strong style="color:var(--warn-700)">Nota del escaneador:</strong> ' + esc(rec.notes) + "</p>" : "") +
    "</div>" +

    '<div class="card anim d2" style="display:flex;flex-direction:column;overflow:hidden">' +
    '<div class="flex between" style="padding:.65rem 1.1rem;border-bottom:1px solid var(--ink-100)"><p class="label">datos extraídos · validación</p>' +
    '<span class="fchip ' + (lowFields.length ? "fchip-warn" : "fchip-ok") + '">' + (lowFields.length ? IC.alert + " " + lowFields.length + " campo(s) a verificar" : IC.check + " confianza alta") + "</span></div>" +
    '<div class="flex1 p4">' +
    '<div class="grid g2 gap2">' +
    field("nº factura", conf.invoice_number, inp("invoice_number", "text", "mono")) +
    field("categoría", conf.category, inp("category")) +
    "</div>" +
    field("proveedor", conf.supplier_name, inp("supplier_name")) +
    '<div class="grid g2 gap2">' +
    field("NIF proveedor", conf.supplier_tax_id, inp("supplier_tax_id", "text", "mono")) +
    '<div class="field"><div class="flex between mb1"><span class="label" style="font-size:9.5px">divisa</span></div><select class="inp inp-sm" data-sel="currency" ' + (editable ? "" : "disabled") + '><option' + (e.currency === "EUR" ? " selected" : "") + ">EUR</option><option" + (e.currency === "USD" ? " selected" : "") + ">USD</option><option" + (e.currency === "MXN" ? " selected" : "") + ">MXN</option></select></div>" +
    "</div>" +
    '<div class="grid g2 gap2">' +
    field("fecha emisión", conf.invoice_date, inp("invoice_date", "date", "mono")) +
    field("vencimiento", conf.due_date, inp("due_date", "date", "mono")) +
    "</div>" +
    '<p class="label mb1 mt2">partidas (' + e.items.length + ")</p>" +
    '<div style="border:1px solid var(--ink-100);border-radius:11px;overflow:hidden"><table class="tbl"><thead><tr><th>concepto</th><th class="r" style="width:60px">cant.</th><th class="r" style="width:84px">precio</th><th class="r" style="width:92px">importe</th></tr></thead><tbody>' +
    e.items.map((it, i) => '<tr><td><input class="edcell" data-fi="' + i + '" data-fk="description" value="' + esc(it.description) + '" ' + (editable ? "" : "readonly") + '></td>' +
      '<td><input class="edcell r" type="number" min="0" data-fi="' + i + '" data-fk="qty" value="' + it.qty + '" ' + (editable ? "" : "readonly") + '></td>' +
      '<td><input class="edcell r" type="number" step="0.01" min="0" data-fi="' + i + '" data-fk="unit_price" value="' + it.unit_price + '" ' + (editable ? "" : "readonly") + '></td>' +
      '<td class="r mono" style="font-weight:700">' + eur(it.qty * it.unit_price) + "</td></tr>").join("") +
    "</tbody></table></div>" +
    '<div class="mt2" style="border:1px solid ' + (totalsMismatch ? "var(--danger-100)" : "var(--ink-100)") + ";background:" + (totalsMismatch ? "rgba(251,238,234,.6)" : "rgba(241,244,238,.7)") + ';border-radius:12px;padding:.9rem" id="totals-box">' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem">' +
    field("base", conf.subtotal, '<input class="inp inp-sm mono" type="number" step="0.01" data-f="subtotal" value="' + e.subtotal + '" ' + (editable ? "" : "readonly") + ">") +
    field("IVA %", conf.tax_rate, '<input class="inp inp-sm mono" type="number" data-f="tax_rate" value="' + e.tax_rate + '" ' + (editable ? "" : "readonly") + ">") +
    field("cuota IVA", conf.tax_amount, '<input class="inp inp-sm mono" type="number" step="0.01" data-f="tax_amount" value="' + e.tax_amount + '" ' + (editable ? "" : "readonly") + ">") +
    field("total", conf.total, '<input class="inp inp-sm mono" style="font-weight:800" type="number" step="0.01" data-f="total" value="' + e.total + '" ' + (editable ? "" : "readonly") + ">") +
    "</div>" +
    '<div class="flex wrap gap1 mt1" id="totals-chips">' +
    '<span class="fchip ' + (totalsMismatch ? "fchip-no" : "fchip-ok") + '">' + (totalsMismatch ? IC.x : IC.check) + " base + IVA = " + eur(round2(e.subtotal + e.tax_amount)) + "</span>" +
    (taxMismatch ? '<span class="fchip fchip-warn">' + IC.alert + " cuota esperada " + eur(expectedTax) + "</span>" : "") +
    (editable && (totalsMismatch || taxMismatch || Math.abs(itemsTotal - e.subtotal) > 0.02) ? '<button class="btn btn-warn btn-sm" style="margin-left:auto" data-act="recalc">' + IC.zap + " Recalcular desde partidas</button>" : "") +
    "</div></div>" +
    '<div class="mt2" style="border:1px solid var(--ink-100);border-radius:12px;padding:.9rem"><p class="label mb1">controles de validación</p><div class="col gap1" id="checks-box">' +
    checks.map(c => '<span class="check ' + (c[0] ? "ok" : "no") + '">' + (c[0] ? IC.check : IC.x) + " " + c[1] + "</span>").join("") +
    "</div>" + (errors.length && editable ? '<p class="xs mt1" style="color:var(--danger-600);margin:.5rem 0 0">Corrige: ' + errors.map(esc).join(" · ") + "</p>" : "") + "</div>" +
    "</div>" +
    (editable
      ? '<div class="flex gap2" style="padding:.8rem 1.1rem;border-top:1px solid var(--ink-100);background:rgba(241,244,238,.7)">' +
        '<button class="btn btn-warn flex1" data-act="reject-open">' + IC.x + " Rechazar</button>" +
        '<button class="btn btn-primary" style="flex:2" id="approve-btn" data-act="approve" ' + (errors.length ? 'disabled title="Hay controles sin superar"' : "") + ">" + IC.check + " Aprobar → DB definitiva</button></div>"
      : (rec.status === "ready_for_review" ? '<div class="flex gap1" style="padding:.8rem 1.1rem;border-top:1px solid var(--ink-100)">' + IC.pen + '<p class="xs mut" style="margin:0">Solo los roles <strong>revisor</strong> y <strong>administración</strong> pueden aprobar o rechazar.</p></div>' : "")) +
    "</div></div></div>";
}

function invoicesView() {
  let list = DB.approved.slice();
  const cats = ["all"].concat(Array.from(new Set(DB.approved.map(a => a.category))));
  if (S.cat !== "all") list = list.filter(a => a.category === S.cat);
  if (S.qInv.trim()) { const t = S.qInv.trim().toLowerCase(); list = list.filter(a => a.supplier_name.toLowerCase().includes(t) || a.invoice_number.toLowerCase().includes(t) || a.supplier_tax_id.toLowerCase().includes(t)); }
  list.sort((a, b) => new Date(b.approved_at) - new Date(a.approved_at));
  const total = list.reduce((s, a) => s + a.amount, 0);

  return '<div class="stack">' +
    '<div class="flex wrap gap2 anim">' +
    '<div class="searchwrap" style="width:min(100%,300px)">' + IC.search + '<input class="inp inp-sm" id="q-inv" placeholder="Proveedor, nº factura, NIF…" value="' + esc(S.qInv) + '" data-q="inv"></div>' +
    '<select class="inp inp-sm" style="width:auto" data-sel="cat">' + cats.map(c => '<option value="' + esc(c) + '"' + (S.cat === c ? " selected" : "") + ">" + (c === "all" ? "Todas las categorías" : esc(c)) + "</option>").join("") + "</select>" +
    (can("export_data") ? '<button class="btn btn-primary btn-sm" style="margin-left:auto;padding:.5rem .9rem" data-act="export-csv" title="Exportar CSV (separador ;)">' + IC.download + " Exportar CSV</button>" : "") +
    "</div>" +
    '<div class="card anim d1" id="inv-card" style="overflow:hidden">' + (list.length === 0
      ? emptyState(IC.archive, "Sin registros definitivos", S.qInv || S.cat !== "all" ? "Prueba a limpiar la búsqueda o el filtro." : "Cuando se aprueben facturas aparecerán aquí, listas para exportar.")
      : '<div style="overflow-x:auto"><table class="tbl" style="min-width:780px"><thead><tr><th>factura</th><th>proveedor</th><th>fecha</th><th class="r">total</th><th>categoría</th><th>revisó</th><th class="r">acciones</th></tr></thead><tbody>' +
      list.map((a, i) => { const rev = userById(a.reviewed_by); return '<tr class="anim d' + Math.min(i + 1, 6) + '">' +
        '<td><button class="flex gap2" style="border:0;background:none;padding:0;cursor:pointer;text-align:left" data-act="view-approved" data-id="' + a.id + '">' + docPrev(a.file_url, "doc-th", a.invoice_number) +
        '<span><span class="mono small" style="font-weight:700;color:var(--pine-800)">' + esc(a.invoice_number) + '</span><span class="mono xs mut" style="display:block">' + a.cycle_minutes + " min de ciclo</span></span></button></td>" +
        '<td><strong>' + esc(a.supplier_name) + '</strong><span class="mono xs mut" style="display:block">' + esc(a.supplier_tax_id) + "</span></td>" +
        '<td class="mono xs">' + fmtDate(a.invoice_date) + '</td>' +
        '<td class="r mono" style="font-weight:800">' + eur(a.amount) + "</td>" +
        '<td><span class="fchip fchip-ok">' + esc(a.category) + "</span></td>" +
        '<td><span class="flex gap1">' + avatar(rev ? rev.full_name : "?", 20) + '<span class="xs">' + fmtDate(a.reviewed_at) + "</span></span></td>" +
        '<td class="r"><span class="flex gap1" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" data-act="view-approved" data-id="' + a.id + '">Ver</button>' +
        (can("delete_invoices") ? '<button class="icon-btn-light icon-btn-danger" data-act="del-open" data-id="' + a.id + '" aria-label="Eliminar" title="Eliminar registro">' + IC.trash + "</button>" : "") +
        "</span></td></tr>"; }).join("") +
      "</tbody></table></div>" +
      '<div class="flex between" style="padding:.65rem 1.1rem;border-top:1px solid var(--ink-100);background:rgba(241,244,238,.7)"><span class="mono xs mut">' + list.length + " registro" + (list.length !== 1 ? "s" : "") + '</span><span class="mono" style="font-weight:800;color:var(--pine-800)">' + eur(total) + "</span></div>") +
    "</div></div>";
}

function auditView() {
  const META = {
    "invoice.scan": ["Captura", IC.scan, "var(--pine-100)", "var(--pine-700)"],
    "invoice.ready": ["Procesado", IC.sync, "var(--warn-50)", "var(--warn-600)"],
    "invoice.approve": ["Aprobación", IC.check, "var(--pine-700)", "var(--pine-50)"],
    "invoice.reject": ["Rechazo", IC.x, "var(--danger-100)", "var(--danger-700)"],
    "invoice.assign": ["Asignación", IC.users, "var(--pine-100)", "var(--pine-700)"],
    "invoice.delete": ["Borrado", IC.trash, "var(--danger-100)", "var(--danger-700)"],
    "data.export": ["Exportación", IC.download, "var(--ink-100)", "var(--ink-700)"],
    "auth.login": ["Acceso", IC.users, "var(--ink-100)", "var(--ink-700)"],
    "user.create": ["Alta usuario", IC.users, "var(--warn-50)", "var(--warn-600)"],
    "user.update": ["Usuarios", IC.users, "var(--warn-50)", "var(--warn-600)"],
  };
  const thumbFor = a => {
    const ap = DB.approved.find(x => x.id === a.record_id);
    if (ap) return ap.file_url;
    const p = DB.pending.find(x => x.id === a.record_id);
    if (p) return p.file_url;
    const bp = DB.approved.find(x => x.pending_id === a.record_id);
    return bp ? bp.file_url : null;
  };
  let rows = DB.audit.slice();
  if (S.audKind !== "all") rows = rows.filter(a => a.action === S.audKind);
  if (S.qAud.trim()) { const t = S.qAud.trim().toLowerCase(); rows = rows.filter(a => a.detail.toLowerCase().includes(t) || a.user_name.toLowerCase().includes(t) || a.action.includes(t)); }
  rows = rows.slice(0, 60);

  return '<div class="stack">' +
    '<div class="flex wrap gap2 between anim">' +
    '<div class="flex wrap gap2"><div class="searchwrap" style="width:min(100%,300px)">' + IC.search + '<input class="inp inp-sm" id="q-aud" placeholder="Buscar en la traza…" value="' + esc(S.qAud) + '" data-q="aud"></div>' +
    '<select class="inp inp-sm" style="width:auto" data-sel="audkind"><option value="all"' + (S.audKind === "all" ? " selected" : "") + ">Todas las acciones</option>" +
    Object.entries(META).map(kv => '<option value="' + kv[0] + '"' + (S.audKind === kv[0] ? " selected" : "") + ">" + kv[1][0] + "</option>").join("") + "</select></div>" +
    '<span class="mono xs mut flex gap1">' + IC.history + " audit_log · " + DB.audit.length + " entradas</span></div>" +
    '<div class="card anim d1" id="aud-card" style="overflow:hidden">' + (rows.length === 0
      ? emptyState(IC.history, "Sin entradas", "Ninguna acción coincide con el filtro actual.")
      : "<div>" + rows.map((a, i) => {
        const m = META[a.action] || META["auth.login"];
        const th = thumbFor(a);
        return '<div class="tl-item anim d' + Math.min(i + 1, 6) + '"><span class="tl-dot" style="background:' + m[2] + ";color:" + m[3] + '">' + m[1] + "</span>" +
          '<div class="flex1"><div class="flex wrap gap1"><span class="fchip" style="background:' + m[2] + ";color:" + m[3] + ';letter-spacing:.1em;text-transform:uppercase;font-size:9px">' + m[0] + '</span><span class="mono xs mut">' + esc(a.action) + " · " + esc(a.table_name) + "</span>" +
          (th ? docPrev(th, "doc-th-s", "Vista previa") : "") + "</div>" +
          '<p class="small" style="margin:.35rem 0 0;font-weight:500">' + esc(a.detail) + "</p></div>" +
          '<div style="text-align:right;flex:none"><span class="flex gap1" style="justify-content:flex-end">' + avatar(a.user_name, 20) + '<span class="xs" style="font-weight:600">' + esc(a.user_name.split(" ")[0]) + '</span></span><span class="mono xs mut" title="' + fmtDateTime(a.created_at) + '">' + timeAgo(a.created_at) + "</span></div></div>";
      }).join("") + "</div>") + "</div></div>";
}

  return '<div class="grid g32" style="align-items:start">' +
    '<div class="card anim" style="overflow:hidden"><div class="flex gap2 between p4" style="padding-bottom:.6rem">' + IC.users + '<p class="h-md flex1">Equipo</p><span class="mono xs mut">tabla users</span></div><div>' +
    DB.users.map((u, i) => '<div class="rowcard anim d' + Math.min(i + 1, 5) + '">' + avatar(u.full_name, 38) +
      '<div class="flex1"><p class="small" style="margin:0;font-weight:700">' + esc(u.full_name) + (u.id === S.user.id ? ' <span class="fchip fchip-warn" style="font-size:9px">tú</span>' : "") + '</p><button class="mono xs mut flex gap1" style="border:0;background:none;padding:0;cursor:pointer;margin-top:.15rem;color:var(--ink-500)" data-act="copy-email" data-email="' + esc(u.email) + '" title="Copiar correo">' + esc(u.email) + " " + IC.copy + "</button></div>" +
      roleChip(u.role) +
      '<button class="switch ' + (u.is_active ? "on" : "") + '" data-act="user-toggle" data-id="' + u.id + '" ' + (u.id === S.user.id ? "disabled" : "") + ' role="switch" aria-checked="' + u.is_active + '" title="' + (u.id === S.user.id ? "No puedes desactivar tu propia cuenta" : u.is_active ? "Desactivar" : "Activar") + '"><i></i></button>' +
      '<span class="mono xs" style="width:56px;text-align:right;color:' + (u.is_active ? "var(--pine-700)" : "var(--ink-300)") + '">' + (u.is_active ? "activo" : "inactivo") + "</span>" +
      '<button class="icon-btn-light" data-act="reset-open" data-id="' + u.id + '" title="Restablecer contraseña" aria-label="Restablecer contraseña de ' + esc(u.full_name) + '">' + IC.key + "</button>" +
      "</div>").join("") + "</div></div>" +
    '<div class="stack">' +
    '<div class="card anim d1 p5"><div class="flex gap2">' + IC.shield + '<p class="h-md">Crear usuario</p></div>' +
    '<p class="xs mut mt1" style="margin:.3rem 0 0">POST /api/users · solo administración. Valida formato, duplicados y longitud.</p>' +
    '<form class="col gap2 mt2" data-form="newuser">' +
    '<div><label class="label mb1" style="display:block">nombre completo</label><input class="inp inp-sm" id="nu-name" value="' + esc(S.nu.full_name) + '" data-nuf="full_name" placeholder="p. ej. Ana Torres"></div>' +
    '<div><label class="label mb1" style="display:block">correo</label><input class="inp inp-sm" id="nu-email" type="email" value="' + esc(S.nu.email) + '" data-nuf="email" placeholder="ana@empresa.com"></div>' +
    '<div><label class="label mb1" style="display:block">contraseña inicial (mín. 6)</label><div class="passwrap"><input class="inp inp-sm" id="nu-pass" type="password" value="' + esc(S.nu.password) + '" data-nuf="password" placeholder="••••••"><button type="button" data-act="pass-show" data-for="nu-pass" aria-label="Mostrar contraseña">' + IC.eye + "</button></div></div>" +
    '<div><label class="label mb1" style="display:block">rol</label><select class="inp inp-sm" data-nuf="role"><option value="scanner"' + (S.nu.role === "scanner" ? " selected" : "") + ">Escaneador/a</option><option value=\"reviewer\"" + (S.nu.role === "reviewer" ? " selected" : "") + ">Revisor/a</option><option value=\"admin\"" + (S.nu.role === "admin" ? " selected" : "") + ">Administración</option></select></div>" +
    '<div id="nu-err"></div>' +
    '<button class="btn btn-primary" type="submit">' + IC.plus + " Crear usuario</button>" +
    "</form></div>" +
    '<div class="card anim d2 p5"><div class="flex gap2">' + IC.shield + '<p class="h-md">Matriz de permisos</p></div>' +
    '<p class="xs mut mt1" style="margin:.3rem 0 0">RBAC aplicado en la navegación y en cada acción.</p><div class="col gap2 mt2">' +
    ["admin", "reviewer", "scanner"].map(r => '<div style="border:1px solid var(--ink-100);background:rgba(241,244,238,.7);border-radius:12px;padding:.85rem">' + roleChip(r) +
      '<div class="col gap1 mt1">' + ROLE_PERMS[r].map(p => '<span class="check ok">' + IC.check + " " + (PERM_LABEL[p] || p) + "</span>").join("") + "</div></div>").join("") +
    "</div></div></div></div>";
}

/* ---------------- layout + capas ---------------- */
function layout() {
  const u = S.user;
  const NAV = [
    ["dashboard", "Panel", IC.dash, ["admin", "reviewer", "scanner"]],
    ["scanner", "Escáner", IC.scan, ["admin", "scanner"]],
    ["review", "Revisión", IC.review, ["admin", "reviewer", "scanner"]],
    ["invoices", "Definitivas", IC.archive, ["admin", "reviewer"]],
    ["audit", "Auditoría", IC.history, ["admin", "reviewer"]],
    ["users", "Usuarios", IC.users, ["admin"]],
  ].filter(n => n[3].indexOf(u.role) !== -1);
  const TITLES = {
    dashboard: ["Panel de control", "estado del pipeline de facturas"],
    scanner: ["Escáner", "captura → OCR → DB transitoria"],
    review: ["Revisión humana", "validación antes del registro definitivo"],
    invoices: ["DB definitiva", "facturas aprobadas y registradas"],
    audit: ["Auditoría", "traza completa de acciones"],
    users: ["Usuarios y roles", "gestión de acceso (RBAC)"],
  };
  const ready = DB.pending.filter(p => p.status === "ready_for_review").length;
  const meta = TITLES[S.view];
  const chip = !S.online
    ? '<span class="chip chip-off">' + IC.wifioff + " Sin conexión · modo offline</span>"
    : S.syncing ? '<span class="chip chip-sync"><span class="spin" style="display:flex">' + IC.sync + "</span> Sincronizando…</span>"
    : '<span class="chip chip-live"><span class="dot-live"></span> API conectada</span>';

  const viewHtml = S.view === "dashboard" ? dashboardView()
    : S.view === "scanner" ? scannerView()
    : S.view === "review" ? (S.reviewId ? reviewDetail() : reviewQueue())
    : S.view === "invoices" ? invoicesView()
    : S.view === "audit" ? auditView() : usersView();

  return '<div class="shell">' +
    '<aside class="side"><div class="side-brand"><span class="side-logo">' + IC.logo + '</span><div><p class="side-name">FacturaFlow</p><p class="side-sub">gestión de facturas</p></div></div>' +
    '<nav class="side-nav">' + NAV.map(n => '<button class="nav-btn ' + (S.view === n[0] ? "on" : "") + '" data-act="nav" data-view="' + n[0] + '">' + n[2] + "<span>" + n[1] + "</span>" + (n[0] === "review" && ready ? '<span class="nav-badge">' + ready + "</span>" : "") + "</button>").join("") + "</nav>" +
    '<div class="side-note"><p class="label" style="color:var(--pine-300)">entorno demo</p><p>API simulada en el dispositivo · PostgreSQL y S3 representados con almacenamiento local.</p></div>' +
    '<div class="side-user"><div class="side-user-row">' + avatar(u.full_name, 34) +
    '<div class="flex1" style="min-width:0"><p class="u-n">' + esc(u.full_name) + '</p><p class="u-r">' + ROLE_LABEL[u.role] + "</p></div>" +
    '<button class="icon-btn" data-act="pass-open" title="Cambiar contraseña" aria-label="Cambiar contraseña">' + IC.key + "</button>" +
    '<button class="icon-btn" data-act="logout" title="Cerrar sesión" aria-label="Cerrar sesión">' + IC.logout + "</button>" +
    "</div></div></aside>" +
    '<div class="main"><header class="topbar"><div class="topbar-in">' +
    '<span class="side-logo" style="width:36px;height:36px;display:none" id="mlogo">' + IC.logo + "</span>" +
    '<div class="flex1" style="min-width:0"><h1 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + meta[0] + '</h1><p class="sub" style="display:none;margin:.1rem 0 0" id="msub">' + meta[1] + "</p></div>" +
    (DB.outbox.length ? '<span class="chip chip-off">' + (S.syncing ? '<span class="spin" style="display:flex">' + IC.sync + "</span>" : IC.sync) + " " + DB.outbox.length + " en cola</span>" : "") +
    chip +
    '<button class="icon-btn-light" data-act="pass-open" title="Cambiar contraseña" aria-label="Cambiar contraseña" id="mkey">' + IC.key + "</button>" +
    '<button class="icon-btn-light icon-btn-danger" data-act="logout" title="Cerrar sesión" aria-label="Cerrar sesión" id="mout">' + IC.logout + "</button>" +
    "</div>" +
    '<nav class="mnav">' + NAV.map(n => '<button class="nav-btn ' + (S.view === n[0] ? "on" : "") + '" data-act="nav" data-view="' + n[0] + '">' + n[2] + "<span>" + n[1] + "</span></button>").join("") + "</nav>" +
    "</header>" +
    '<main class="content">' + viewHtml + "</main>" +
    '<footer class="foot"><p>FacturaFlow · demo estática — Captura → DB transitoria → Revisión humana → DB definitiva</p></footer>' +
    "</div>" + modalLayer() + toastLayer() + "</div>";
}

function modalLayer() {
  const m = S.modal;
  if (!m) return "";
  const close = '<button class="icon-btn-light" data-act="modal-close" aria-label="Cerrar" style="border:0">' + IC.x + "</button>";
  const bg = '<div class="modal-bg" data-act="modal-bg">';
  if (m.type === "reject") {
    return bg + '<div class="modal"><div class="modal-h"><h3>Rechazar factura</h3>' + close + '</div><div class="modal-b">' +
      '<p class="small mut">La factura quedará marcada como rechazada en la DB transitoria y no pasará al registro definitivo. El motivo se guarda en la auditoría.</p>' +
      '<label class="label mb1 mt2" style="display:block" for="rej-reason">motivo del rechazo</label>' +
      '<textarea class="inp" id="rej-reason" data-reject="1" placeholder="p. ej. El importe no coincide con el albarán…" autofocus>' + esc(S.rejectReason) + "</textarea>" +
      '<p class="mono xs mut mt1" id="rej-count">' + (S.rejectReason.trim().length < 8 ? "mínimo 8 caracteres (" + S.rejectReason.trim().length + "/8)" : "motivo válido") + "</p>" +
      '</div><div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button>' +
      '<button class="btn btn-danger" id="rej-btn" data-act="reject-confirm" ' + (S.rejectReason.trim().length < 8 ? "disabled" : "") + ">" + IC.x + " Confirmar rechazo</button></div></div></div>";
  }
  if (m.type === "del") {
    const rec = DB.approved.find(a => a.id === m.id);
    if (!rec) return "";
    return bg + '<div class="modal"><div class="modal-h"><h3>Eliminar registro definitivo</h3>' + close + '</div><div class="modal-b">' +
      '<p class="small">Vas a eliminar <strong>' + esc(rec.invoice_number) + "</strong> de <strong>" + esc(rec.supplier_name) + "</strong> (" + eur(rec.amount) + ") de la base de datos definitiva. La acción queda registrada en la auditoría. Esta operación solo está disponible para <strong>administración</strong> (tu rol actual).</p>" +
      '</div><div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button>' +
      '<button class="btn btn-danger" data-act="del-confirm" data-id="' + rec.id + '">' + IC.trash + " Eliminar definitivamente</button></div></div></div>";
  }
  if (m.type === "view") {
    const rec = DB.approved.find(a => a.id === m.id);
    if (!rec) return "";
    const rev = userById(rec.reviewed_by);
    const rows = [["proveedor", esc(rec.supplier_name)], ["NIF", esc(rec.supplier_tax_id)], ["fecha emisión", fmtDate(rec.invoice_date)], ["vencimiento", fmtDate(rec.due_date)], ["base imponible", eur(rec.subtotal)], ["cuota IVA", eur(rec.tax_amount)], ["total", eur(rec.amount)], ["categoría", esc(rec.category)], ["revisada por", esc(rev ? rev.full_name : "-")], ["ciclo", rec.cycle_minutes + " min desde el escaneo"]];
    return bg + '<div class="modal wide"><div class="modal-h"><h3>' + esc(rec.invoice_number) + " · " + esc(rec.supplier_name) + "</h3>" + close + '</div><div class="modal-b"><div class="grid g2" style="align-items:start">' +
      docPrev(rec.file_url, "", "Documento " + rec.invoice_number, true) +
      "<div>" + rows.map(r => '<div class="flex between" style="border-bottom:1px solid var(--ink-100);padding:.4rem 0;gap:1rem"><span class="label" style="font-size:9.5px">' + r[0] + '</span><span style="font-weight:600;font-size:13px' + (r[0] === "total" ? ";font-family:var(--mono);font-size:16px;color:var(--pine-800)" : "") + '">' + r[1] + "</span></div>").join("") +
      '<p class="xs mut mt2" style="line-height:1.5">' + esc(rec.description) + "</p></div></div></div>" +
      '<div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cerrar</button></div></div></div>';
  }
  if (m.type === "reset") {
    const t = userById(m.id);
    if (!t) return "";
    return bg + '<div class="modal"><div class="modal-h"><h3>Restablecer contraseña</h3>' + close + '</div><div class="modal-b">' +
      '<p class="small mut">Nueva contraseña para <strong style="color:var(--ink-900)">' + esc(t.full_name) + "</strong> (" + esc(t.email) + "). Se registrará en la auditoría.</p>" +
      '<label class="label mb1 mt2" style="display:block" for="reset-pass">nueva contraseña (mín. 6)</label>' +
      '<div class="passwrap"><input class="inp" id="reset-pass" type="password" data-resetpass="1" value="' + esc(S.resetPass) + '" autofocus><button type="button" data-act="pass-show" data-for="reset-pass" aria-label="Mostrar contraseña">' + IC.eye + "</button></div>" +
      '</div><div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button>' +
      '<button class="btn btn-primary" data-act="reset-confirm" data-id="' + t.id + '" ' + (S.resetPass.length < 6 ? "disabled" : "") + ' id="reset-btn">' + IC.key + " Guardar contraseña</button></div></div></div>";
  }
  if (m.type === "chpass") {
    return bg + '<div class="modal"><div class="modal-h"><h3>Cambiar mi contraseña</h3>' + close + '</div><div class="modal-b">' +
      '<p class="small mut">Verificamos tu contraseña actual antes de aplicar el cambio, igual que el backend.</p>' +
      '<form class="col gap2 mt2" data-form="chpass">' +
      '<div><label class="label mb1" style="display:block" for="cp-cur">contraseña actual</label><input class="inp inp-sm" id="cp-cur" type="password" autocomplete="current-password"></div>' +
      '<div><label class="label mb1" style="display:block" for="cp-next">nueva contraseña (mín. 6)</label><input class="inp inp-sm" id="cp-next" type="password"></div>' +
      '<div><label class="label mb1" style="display:block" for="cp-conf">confirmar nueva contraseña</label><input class="inp inp-sm" id="cp-conf" type="password"></div>' +
      '<div id="cp-err"></div>' +
      '<button class="btn btn-primary" type="submit">' + IC.key + " Actualizar contraseña</button>" +
      "</form></div>" +
      '<div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button></div></div></div>';
  }
  if (m.type === "cam") {
    return bg + '<div class="modal"><div class="modal-h"><h3>Capturar con cámara</h3>' + close + '</div><div class="modal-b">' +
      '<div class="camview"><video id="cam-video" autoplay playsinline muted></video><div class="scanline"></div><div class="scan-frame"></div><div class="camerr" id="cam-err" style="display:none"></div></div>' +
      '<p class="mono xs mut mt1">Consejo: buena luz, la factura plana y encuadrada por completo.</p>' +
      '</div><div class="modal-f"><button class="btn btn-ghost" data-act="modal-close">Cancelar</button>' +
      '<button class="btn btn-primary" data-act="cam-capture" id="cam-btn">' + IC.camera + " Capturar</button></div></div></div>";
  }
  return "";
}

function toastLayer() {
  if (!S.toasts.length) return '<div class="toasts" id="toasts"></div>';
  const meta = { ok: [IC.check, "t-ok"], warn: [IC.alert, "t-warn"], err: [IC.x, "t-err"] };
  return '<div class="toasts" id="toasts">' + S.toasts.map(t => {
    const m = meta[t.kind] || meta.ok;
    return '<div class="toast ' + m[1] + '"><span class="t-ic">' + m[0] + "</span><p>" + esc(t.msg) + '</p><button data-act="toast-x" data-id="' + t.id + '" aria-label="Cerrar aviso">' + IC.x + "</button></div>";
  }).join("") + "</div>";
}

/* ---------------- render ---------------- */
function render() {
  const root = $("#app");
  root.innerHTML = S.user ? layout() : loginView();

}
function afterRender() {
  document.querySelectorAll(".count").forEach(countUp);
  const m = S.modal;
  if (m && m.type === "cam") startCamera();
  const mz = $("#mlogo"), ms = $("#msub"), mk = $("#mkey"), mo = $("#mout");

  }
  if (window.innerWidth >= 1024) { if (mk) mk.style.display = "none"; if (mo) mo.style.display = "none"; }
  window.addEventListener("resize", onResize, { once: true });
}
function onResize() {
  const mz = $("#mlogo"), ms = $("#msub"), mk = $("#mkey"), mo = $("#mout");
  const small = window.innerWidth < 1024;
  if (mz) mz.style.display = small ? "flex" : "none";
  if (ms) ms.style.display = small ? "block" : "none";
  if (mk) mk.style.display = small ? "" : "none";
  if (mo) mo.style.display = small ? "" : "none";

}

/* ---------------- cámara ---------------- */
function startCamera() {
  const video = $("#cam-video");
  if (!video) return;
  if (camStream) { video.srcObject = camStream; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showCamErr("Este navegador no expone la cámara. Usa la subida de archivo o las facturas demo."); return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {
      camStream = stream;
      const v = $("#cam-video");
      if (v) v.srcObject = stream;
      else stream.getTracks().forEach(t => t.stop());
    })
    .catch(() => showCamErr("No se pudo acceder a la cámara. Concede el permiso o usa la subida de archivo / facturas demo."));
}
function showCamErr(msg) {
  const e = $("#cam-err");
  if (e) { e.style.display = "flex"; e.textContent = msg; }
  const b = $("#cam-btn"); if (b) b.disabled = true;
}
function stopCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

/* ---------------- flujo de escaneo ---------------- */
async function handleFile(file, camDataUrl) {
  if (!file.type.match(/^image\//) && file.type !== "application/pdf") { toast("err", "Formato no admitido. Usa JPG, PNG, WEBP o PDF."); return; }
  if (file.size > 12 * 1024 * 1024) { toast("err", "El archivo supera los 12 MB permitidos."); return; }
  S.scanStep = "processing"; S.scanStage = 0; S.scanRes = null;
  S.scanFile = camDataUrl ? "camara_" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".jpg" : file.name;
  render();
  let dataUrl = camDataUrl || null;
  if (!dataUrl && file.type.match(/^image\//)) {
    try { dataUrl = await downscaleImage(await fileToDataUrl(file)); } catch (e) { dataUrl = null; }
  }
  const res = await performOCR(S.scanFile, file.size || (dataUrl ? dataUrl.length : 1000), dataUrl, i => { S.scanStage = i; render(); });
  S.scanRes = res; S.scanStep = "result";
  render();
}
function sendScan() {
  if (!S.scanRes || S.scanBusy) return;
  S.scanBusy = true; render();
  setTimeout(() => {
    try {
      apiCreateScan({
        filename: S.scanFile, previewUrl: S.scanRes.docUrl, extracted: S.scanRes.extracted,
        confidence: S.scanRes.confidence, ocr_lines: S.scanRes.lines, priority: S.prio,
        notes: S.notes.trim() || undefined,
      }, S.user);
      toast("ok", S.scanRes.extracted.invoice_number + " enviada a la DB transitoria" + (S.online ? " · pasará a revisión en unos segundos" : " · se sincronizará al volver la conexión"));
      S.scanStep = "pick"; S.scanRes = null; S.notes = ""; S.prio = "medium";
    } catch (e) { toast("err", e.message || "No se pudo guardar el escaneo"); }
    S.scanBusy = false;
    render();
  }, 400);
}

function openReview(id) {
